name: Phase 8 Bootstrap Patch

on:
  push:
    branches: [phase8/recruiter-first-outreach]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check bootstrap marker
        id: marker
        run: |
          if test -f scripts/phase8-bootstrap-patch.py; then echo "needed=true" >> "$GITHUB_OUTPUT"; else echo "needed=false" >> "$GITHUB_OUTPUT"; fi
      - name: Apply trusted Phase 8 source patch
        if: steps.marker.outputs.needed == 'true'
        run: python3 scripts/phase8-bootstrap-patch.py
      - name: Verify changed source builds
        if: steps.marker.outputs.needed == 'true'
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
      - name: Commit finalized source patch
        if: steps.marker.outputs.needed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm scripts/phase8-bootstrap-patch.py
          git add src/recruiters/RecruiterOutreachSendService.ts src/recruiters/RecruiterDiscoveryRepository.ts .github/workflows/ci.yml scripts/phase8-bootstrap-patch.py
          git diff --cached --check
          git commit -m 'Phase 8: finalize bootstrap patch'
          git push origin HEAD:phase8/recruiter-first-outreach
