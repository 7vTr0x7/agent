name: Phase 8 Bootstrap Patch

on:
  push:
    branches: [phase8/recruiter-first-outreach]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.event.head_commit.message != 'Phase 8: finalize bootstrap patch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply trusted Phase 8 source patch
        run: python3 scripts/phase8-bootstrap-patch.py
      - name: Verify changed source builds
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
      - name: Finalize Phase 8 source patch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm scripts/phase8-bootstrap-patch.py .github/workflows/phase8-bootstrap.yml
          git add src/recruiters/RecruiterOutreachSendService.ts src/recruiters/RecruiterDiscoveryRepository.ts .github/workflows/ci.yml scripts/phase8-bootstrap-patch.py .github/workflows/phase8-bootstrap.yml
          git diff --cached --check
          git commit -m 'Phase 8: finalize bootstrap patch'
          git push origin HEAD:phase8/recruiter-first-outreach
