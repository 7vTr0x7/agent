name: Temporary Recruiter Domain Diagnostic
on:
  push:
    branches: [matcher/calibration]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start isolated PostgreSQL
        run: |
          set -euo pipefail
          docker network create job-agent-diagnostic
          docker run -d --name job-agent-diagnostic-postgres --network job-agent-diagnostic -e POSTGRES_DB=job_agent -e POSTGRES_USER=job_agent -e POSTGRES_PASSWORD=ci postgres:17-alpine
          ready=false
          for i in $(seq 1 60); do
            if docker exec job-agent-diagnostic-postgres pg_isready -U job_agent -d job_agent >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
      - name: Apply migrations
        run: |
          set -euo pipefail
          docker run --rm --network job-agent-diagnostic -e DATABASE_URL=postgres://job_agent:ci@job-agent-diagnostic-postgres:5432/job_agent job-agent-ci node -e "const {Database}=require('./dist/database/Database'); const {MigrationRunner}=require('./dist/database/MigrationRunner'); const db=new Database(process.env.DATABASE_URL); new MigrationRunner(db).run().then(()=>db.close()).catch(e=>{console.error(e);process.exit(1)})"
        env:
          DOCKER_BUILDKIT: 1
      - name: Build runtime image
        run: docker build --tag job-agent-ci .
      - name: Real recruiter-first diagnostic
        run: |
          set -o pipefail
          timeout --foreground --signal=TERM --kill-after=20s 12m docker run --rm --network job-agent-diagnostic \
            -e NODE_ENV=test \
            -e DATABASE_URL=postgres://job_agent:ci@job-agent-diagnostic-postgres:5432/job_agent \
            -e AUTOMATION_ENABLED=false \
            -e APPLICATION_DRY_RUN=true \
            -e APPLICATION_LIVE_ENABLED=false \
            -e GMAIL_ENABLED=false \
            -e EMAIL_ENABLED=false \
            -e OUTBOUND_ENABLED=false \
            -e PROACTIVE_RECRUITER_ENABLED=true \
            -e PROACTIVE_RECRUITER_SEND_ENABLED=false \
            -e PROACTIVE_RECRUITER_FIXTURE=false \
            -e PROACTIVE_RECRUITER_DIAGNOSTICS=true \
            -e RECRUITER_REQUIRE_VERIFIED_EMAIL=true \
            -e STALE_SUBMISSION_RECONCILIATION_ENABLED=false \
            -e CANDIDATE_PROFILE_ID=phase10-proactive-candidate \
            -e CANDIDATE_YEARS_EXPERIENCE=3 \
            -e 'CANDIDATE_SKILLS=React,Next.js,TypeScript,JavaScript,Redux Toolkit,Tailwind,Node.js,Express,REST APIs,MongoDB,GraphQL,Docker,Git,Github' \
            -e 'CANDIDATE_TARGET_TITLES=React Developer,React.js Developer,Frontend Developer,Frontend Engineer,React / Next.js Developer,Next.js Developer,Full Stack React Developer,Full Stack Engineer' \
            -e CANDIDATE_FIRST_NAME=Runtime \
            -e CANDIDATE_LAST_NAME=Recruiter \
            -e CANDIDATE_FULL_NAME='Runtime Recruiter' \
            -e CANDIDATE_LOCATION=India \
            -e CANDIDATE_SPONSORSHIP_REQUIRED=false \
            -e CANDIDATE_NOTICE_PERIOD_DAYS=0 \
            -e CANDIDATE_REMOTE_ELIGIBLE=true \
            job-agent-ci node scripts/proactive-recruiter-once.cjs 2>&1 | tee recruiter-domain-diagnostic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recruiter-domain-diagnostic
          path: recruiter-domain-diagnostic.log
          if-no-files-found: ignore
