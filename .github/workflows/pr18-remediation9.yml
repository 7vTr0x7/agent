name: temp-pr18-remediation9
on:
  push:
    branches: [fix/extreme-public-recruiter-discovery]
    paths: [.github/workflows/pr18-remediation9.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/extreme-public-recruiter-discovery}
      - name: Restore known-good service and apply SSRF guard
        shell: bash
        run: |
          git show 658ede0e8f4bf2eea1638acf86ef25eb47cdd7fc:src/recruiters/ProactiveRecruiterDiscoveryService.ts > src/recruiters/ProactiveRecruiterDiscoveryService.ts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recruiters/ProactiveRecruiterDiscoveryService.ts')
          s=p.read_text()
          old='''if(candidates.size<this.targetCandidates){const c=this.buildCandidateFromPage(profile,removeQueryEcho(normalized,query),source.id,candidateUrls[0],m);if(c)this.mergeCandidate(candidates,c,stats,m);}}}m.finalDiscovered=candidates.size;return[...candidates.values()];'''
          new='''if(candidates.size<this.targetCandidates){const safeFallbackUrls=(await Promise.all(candidateUrls.map(async url=>({url,check:await validatePublicFetchUrl(url)})))).filter((item):item is {url:string;check:{url:URL}}=>!("reason" in item.check));const fallbackUrl=safeFallbackUrls[0]?.url;if(fallbackUrl){const c=this.buildCandidateFromPage(profile,removeQueryEcho(normalized,query),source.id,fallbackUrl,m);if(c)this.mergeCandidate(candidates,c,stats,m);}}}m.finalDiscovered=candidates.size;return[...candidates.values()];'''
          if old not in s:
            raise SystemExit('target fallback block not found in known-good source')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/recruiters/ProactiveRecruiterDiscoveryService.ts
          git commit -m 'fix: enforce public URL validation before recruiter fallback'
          git push origin HEAD:fix/extreme-public-recruiter-discovery
      - name: Capture exact regression result
        shell: bash
        run: |
          set +e
          npm ci > /tmp/npm-ci.log 2>&1
          npm test -- --runInBand src/recruiters/PublicProfileFetchBoundary.integration.test.ts > /tmp/focused.log 2>&1; FOCUSED=$?
          npm run typecheck > /tmp/typecheck.log 2>&1; TYPECHECK=$?
          npm run build > /tmp/build.log 2>&1; BUILD=$?
          npm test -- --runInBand > /tmp/jest.log 2>&1; JEST=$?
          printf 'FOCUSED=%s\nTYPECHECK=%s\nBUILD=%s\nJEST=%s\n' "$FOCUSED" "$TYPECHECK" "$BUILD" "$JEST" > /tmp/status.txt
          exit 0
      - name: Upload exact validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr18-exact-regression-logs
          path: /tmp/{status.txt,npm-ci.log,focused.log,typecheck.log,build.log,jest.log}
