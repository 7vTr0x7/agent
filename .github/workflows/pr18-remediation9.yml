name: temp-pr18-remediation9
on:
  push:
    branches: [fix/extreme-public-recruiter-discovery]
    paths: [.github/workflows/pr18-remediation9.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/extreme-public-recruiter-discovery}
      - name: Run full regression validation
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test -- --runInBand
