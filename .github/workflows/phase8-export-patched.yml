name: Phase 8 Export Patched Source

on:
  push:
    branches: [phase8/recruiter-first-outreach]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply trusted patch in isolated runner
        run: python3 scripts/phase8-bootstrap-patch.py
      - name: Package patched source
        run: |
          set -euo pipefail
          mkdir -p phase8-patched-source/src/recruiters phase8-patched-source/.github/workflows
          cp src/recruiters/RecruiterOutreachSendService.ts phase8-patched-source/src/recruiters/
          cp src/recruiters/RecruiterDiscoveryRepository.ts phase8-patched-source/src/recruiters/
          cp .github/workflows/ci.yml phase8-patched-source/.github/workflows/
          tar -czf phase8-patched-source.tar.gz phase8-patched-source
      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: phase8-patched-source
          path: phase8-patched-source.tar.gz
          if-no-files-found: error
