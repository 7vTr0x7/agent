name: Recruiter Email Real Validation

on:
  push:
    branches: [matcher/calibration]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: matcher/calibration
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Real public recruiter email discovery dry run
        env:
          RECRUITER_TEST_COMPANY_NAME: Enter Recruitment
          RECRUITER_TEST_COMPANY_DOMAIN: enterrecruitment.com
          RECRUITER_TEST_JOB_TITLE: React Frontend Developer
          RECRUITER_TEST_JOB_DESCRIPTION: React Next.js TypeScript frontend engineer, India/Bengaluru/remote eligible, approximately 3 years experience.
        run: |
          set -euo pipefail
          npm run dry-run:recruiters | tee recruiter-email-real.log
          grep -q '"dryRun": true' recruiter-email-real.log
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruiter-email-real-validation
          path: recruiter-email-real.log
          if-no-files-found: warn
