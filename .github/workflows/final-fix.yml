name: final-fix
on:
  push:
    branches: [fix/final-live-completion]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore target from main and apply fix
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- src/recruiters/PublicHiringPostDiscoveryProvider.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/recruiters/PublicHiringPostDiscoveryProvider.ts')
          s = p.read_text()
          old = '''export function experienceCompatible(text: string, candidateYears = 3): boolean {\n  const ranges = [...text.matchAll(/(\\d+)\\s*(?:-|to|–|—)\\s*(\\d+)\\s*years?/gi)].map(m => [Number(m[1]), Number(m[2])] as const);\n  const minimums = [...text.matchAll(/(?:\\b|\\D)(\\d+)\\s*\\+\\s*years?/gi)].map(m => Number(m[1]));\n  if (!ranges.length && !minimums.length) return true;\n  // A lower experience band is still a valid opportunity for a more experienced\n  // candidate. Only a minimum above the candidate's experience should reject.\n  return ranges.some(([min]) => candidateYears >= min) || minimums.some(min => candidateYears >= min);\n}\n'''
          new = '''export function experienceCompatible(text: string, candidateYears = 3): boolean {\n  const ranges = [...text.matchAll(/(\\d+)\\s*(?:-|to|–|—)\\s*(\\d+)\\s*years?/gi)].map(m => [Number(m[1]), Number(m[2])] as const);\n  const minimums = [...text.matchAll(/(?:\\b|\\D)(\\d+)\\s*\\+\\s*years?/gi)].map(m => Number(m[1]));\n  if (!ranges.length && !minimums.length) return true;\n  if (ranges.length + minimums.length === 1) {\n    if (ranges.length) return candidateYears >= ranges[0]![0];\n    return candidateYears >= minimums[0]!;\n  }\n  return ranges.some(([min, max]) => candidateYears >= min && candidateYears <= max) || minimums.some(min => candidateYears >= min);\n}\n'''
          if old not in s:
              raise SystemExit('target function not found')
          p.write_text(s.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/recruiters/PublicHiringPostDiscoveryProvider.ts
          git commit -m "fix: enforce mixed experience bands correctly"
          git push origin HEAD:fix/final-live-completion
