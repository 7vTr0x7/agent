name: Local Runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  local-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      JOB_AGENT_LOCAL_API_PORT: 3100
      JOB_AGENT_LOCAL_RESET: true
      JOB_DISCOVERY_INTERVAL_MS: 120000
      DISCOVERY_SOURCE_TIMEOUT_MS: 20000
      DISCOVERY_SOURCE_RETRIES: 0
      FAST_MATCHING_LIMIT: 150
      CANDIDATE_PROFILE_ID: local-ci-candidate
      CANDIDATE_YEARS_EXPERIENCE: 3
      CANDIDATE_SKILLS: React,Next.js,TypeScript,JavaScript,Redux Toolkit,Node.js,Express,REST APIs,MongoDB,GraphQL,Tailwind,HTML,CSS
      CANDIDATE_TARGET_TITLES: Frontend Engineer,Frontend Developer,React Developer,React/Next.js Developer,Full Stack Developer,Full Stack Engineer
      CANDIDATE_LOCATION: India
      CANDIDATE_PREFERRED_LOCATIONS: Bengaluru,Bangalore,India,Remote
      CANDIDATE_REMOTE_ELIGIBLE: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start local Job Agent
        run: npm run local:run
      - name: Verify live dashboard and API
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:3100/healthz | tee /tmp/health.json
          curl --fail --silent http://127.0.0.1:3100/api/summary | tee /tmp/summary.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"jobs"' /tmp/summary.json
          grep -q '"topMatches"' /tmp/summary.json
          curl --fail --silent 'http://127.0.0.1:3100/api/jobs?limit=5' | tee /tmp/jobs.json
          curl --fail --silent 'http://127.0.0.1:3100/api/applications?limit=5' | tee /tmp/applications.json
      - name: Allow first discovery and matching cycle to complete
        run: sleep 180
      - name: Capture real local runtime result
        run: |
          set +e
          npm run local:status | tee /tmp/local-status.txt
          curl --fail --silent http://127.0.0.1:3100/api/summary | tee /tmp/run1-summary.json
          docker logs job-agent-local-app 2>&1 | tail -n 300 | tee /tmp/local-agent.log
          docker exec job-agent-local-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM job_opportunities;" | tee /tmp/run1-jobs.txt
          docker exec job-agent-local-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM match_decisions;" | tee /tmp/run1-matches.txt
          docker exec job-agent-local-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM applications;" | tee /tmp/run1-applications.txt
          docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' job-agent-local-app job-agent-local-postgres
      - name: Observe second real discovery cycle
        run: |
          set -euo pipefail
          sleep 130
          curl --fail --silent http://127.0.0.1:3100/api/summary | tee /tmp/run2-summary.json
          docker exec job-agent-local-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM job_opportunities;" | tee /tmp/run2-jobs.txt
          docker exec job-agent-local-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM match_decisions;" | tee /tmp/run2-matches.txt
          test "$(docker inspect -f '{{.State.Status}}' job-agent-local-app)" = running
          test "$(docker inspect -f '{{.State.Status}}' job-agent-local-postgres)" = running
      - name: Observe third real discovery cycle
        run: |
          set -euo pipefail
          sleep 130
          curl --fail --silent http://127.0.0.1:3100/api/summary | tee /tmp/run3-summary.json
          docker exec job-agent-local-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM job_opportunities;" | tee /tmp/run3-jobs.txt
          docker exec job-agent-local-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM match_decisions;" | tee /tmp/run3-matches.txt
          test "$(docker inspect -f '{{.State.Status}}' job-agent-local-app)" = running
          test "$(docker inspect -f '{{.State.Status}}' job-agent-local-postgres)" = running
          node -e "const fs=require('fs'); const n=f=>Number(fs.readFileSync(f,'utf8').trim()); if(n('/tmp/run2-jobs.txt')<n('/tmp/run1-jobs.txt')||n('/tmp/run3-jobs.txt')<n('/tmp/run2-jobs.txt')) process.exit(1); console.log(JSON.stringify({run1Jobs:n('/tmp/run1-jobs.txt'),run2Jobs:n('/tmp/run2-jobs.txt'),run3Jobs:n('/tmp/run3-jobs.txt')}))"
      - name: Verify continuous operation and safety
        run: |
          set -euo pipefail
          npm run local:status
          curl --fail --silent http://127.0.0.1:3100/healthz
          test "$(docker inspect -f '{{.State.Status}}' job-agent-local-app)" = running
          test "$(docker inspect -f '{{.State.Status}}' job-agent-local-postgres)" = running
          test "$(docker exec job-agent-local-app printenv AUTOMATION_ENABLED)" = false
          test "$(docker exec job-agent-local-app printenv APPLICATION_DRY_RUN)" = true
          test "$(docker exec job-agent-local-app printenv APPLICATION_LIVE_ENABLED)" = false
          test "$(docker exec job-agent-local-app printenv GMAIL_ENABLED)" = false
          test "$(docker exec job-agent-local-app printenv OUTBOUND_ENABLED)" = false
          grep -q '"outcome":"NOT_SUBMITTED"' /tmp/local-agent.log
          ! grep -q '"submitted":true' /tmp/local-agent.log
      - name: Upload local runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-runtime-evidence
          path: /tmp/*.json
          if-no-files-found: ignore
      - name: Stop local runtime
        if: always()
        run: JOB_AGENT_LOCAL_CLEANUP=true npm run local:stop
