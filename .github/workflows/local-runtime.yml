name: Local Runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  local-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JOB_AGENT_LOCAL_API_PORT: 3100
      JOB_AGENT_LOCAL_RESET: true
      JOB_DISCOVERY_INTERVAL_MS: 120000
      ENRICHMENT_INTERVAL_MS: 60000
      DISCOVERY_SOURCE_TIMEOUT_MS: 20000
      DISCOVERY_FEDERATION_TIMEOUT_MS: 1800000
      DISCOVERY_SOURCE_RETRIES: 0
      PLATFORM_SEARCH_CONCURRENCY: 16
      PLATFORM_ITEM_TIMEOUT_MS: 20000
      FAST_MATCHING_LIMIT: 150
      CANDIDATE_PROFILE_ID: local-ci-candidate
      CANDIDATE_YEARS_EXPERIENCE: 3
      CANDIDATE_SKILLS: React,Next.js,TypeScript,JavaScript,Redux Toolkit,Node.js,Express,REST APIs,MongoDB,GraphQL,Tailwind,HTML,CSS
      CANDIDATE_TARGET_TITLES: Frontend Engineer,Frontend Developer,React Developer,React/Next.js Developer,Full Stack Developer,Full Stack Engineer
      CANDIDATE_LOCATION: India
      CANDIDATE_PREFERRED_LOCATIONS: Bengaluru,Bangalore,India,Remote
      CANDIDATE_REMOTE_ELIGIBLE: true
      PROACTIVE_RECRUITER_MAX_QUERIES: 18
      PROACTIVE_RECRUITER_TARGET_CANDIDATES: 8
      PROACTIVE_RECRUITER_SEARCH_PROVIDERS: bing-direct,google-direct,bing-jina,qwant-direct
      PROACTIVE_RECRUITER_JOB_LINKED_LIMIT: 5
      PUBLIC_HIRING_POST_MAX_QUERIES: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start real local product runtime
        run: npm run local:run
      - name: Verify live health and all product APIs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:3100/healthz | tee /tmp/health.json
          for endpoint in summary jobs applications matches recruiters contacts content source-health platform-coverage; do
            case "$endpoint" in
              jobs) url='http://127.0.0.1:3100/api/jobs?limit=20' ;;
              applications) url='http://127.0.0.1:3100/api/applications?limit=20' ;;
              matches) url='http://127.0.0.1:3100/api/matches?limit=20' ;;
              recruiters) url='http://127.0.0.1:3100/api/recruiters?limit=20' ;;
              contacts) url='http://127.0.0.1:3100/api/contacts?limit=20' ;;
              content) url='http://127.0.0.1:3100/api/content?limit=20' ;;
              source-health) url='http://127.0.0.1:3100/api/source-health' ;;
              platform-coverage) url='http://127.0.0.1:3100/api/platform-coverage' ;;
              summary) url='http://127.0.0.1:3100/api/summary' ;;
            esac
            curl --fail --silent "$url" > "/tmp/${endpoint}.json"
          done
          node - <<'NODE'
          const fs=require('fs');
          const read=n=>JSON.parse(fs.readFileSync(`/tmp/${n}.json`,'utf8'));
          const s=read('summary');
          for(const k of ['jobs','matches','applications','recruiters','contacts','content','matchApply','matchReview','matchReject']) {
            if(!Number.isFinite(Number(s[k])) || Number(s[k])<0) throw new Error(`invalid summary field ${k}`);
          }
          if(Number(s.matchApply)+Number(s.matchReview)+Number(s.matchReject)!==Number(s.matches)) throw new Error('match decision totals do not reconcile');
          const p=read('platform-coverage');
          if(p.registry.total<200) throw new Error(`platform registry below requirement: ${p.registry.total}`);
          if(p.registry.executable+p.registry.catalogOnly!==p.registry.total) throw new Error('platform capability totals do not reconcile');
          console.log(JSON.stringify({summary:s,registry:p.registry,runtime:p.latestRuntime}));
          NODE
      - name: Execute complete platform catalog and matching cycle
        id: federation
        shell: bash
        run: |
          set -o pipefail
          npm run platform-federation:once | tee /tmp/federation-cycle.json
          federation_status=${PIPESTATUS[0]}
          echo "federation_status=$federation_status" | tee /tmp/federation-status.txt
          npm run matching:once | tee /tmp/matching-cycle.json
          matching_status=${PIPESTATUS[0]}
          echo "matching_status=$matching_status" | tee /tmp/matching-status.txt
          if (( matching_status != 0 )); then exit "$matching_status"; fi
          exit "$federation_status"
      - name: Wait for a real discovery and matching cycle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS+900))
          while true; do
            summary="$(curl --fail --silent http://127.0.0.1:3100/api/summary)"
            jobs="$(node -e 'const s=JSON.parse(process.argv[1]);process.stdout.write(String(Number(s.jobs)||0))' "$summary")"
            matches="$(node -e 'const s=JSON.parse(process.argv[1]);process.stdout.write(String(Number(s.matches)||0))' "$summary")"
            if (( jobs > 0 && matches > 0 )); then echo "$summary" | tee /tmp/real-summary.json; break; fi
            if (( SECONDS >= deadline )); then echo "$summary"; exit 1; fi
            sleep 5
          done
      - name: Verify complete 200-platform coverage and provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:3100/api/platform-coverage > /tmp/final-platforms.json
          node - <<'NODE'
          const fs=require('fs'); const p=JSON.parse(fs.readFileSync('/tmp/final-platforms.json','utf8'));
          const r=p.registry, rows=p.platforms;
          if(r.total<200) throw new Error(`registry=${r.total}`);
          if(r.executable+r.catalogOnly!==r.total) throw new Error('registry capability reconciliation failed');
          const actual=rows.filter(x=>x.completed_at!==null && x.completed_at!==undefined);
          const seen=new Set(actual.map(x=>x.platform_id));
          if(seen.size!==r.total) throw new Error(`actual runtime coverage is incomplete: ${seen.size}/${r.total}`);
          const allowed=new Set(['SUCCESS_WITH_JOBS','SUCCESS_ZERO_JOBS','TIMEOUT','RATE_LIMITED','BLOCKED_OR_RESTRICTED','PARSER_ERROR','NETWORK_ERROR','HTTP_ERROR','UNSUPPORTED','CONFIGURATION_ERROR','UNKNOWN_ERROR']);
          for(const row of actual) if(!allowed.has(row.outcome)) throw new Error(`unknown platform outcome ${row.outcome}`);
          console.log(JSON.stringify({registry:r,actualOutcomes:actual.length,latestRuntime:p.latestRuntime,platformRows:rows.length}));
          NODE
      - name: Verify dashboard is wired to live product data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:3100/ > /tmp/dashboard.html
          for text in 'Top opportunities' 'Application queue' 'Recruiters' 'Public contact evidence' 'Hiring content' 'Platform coverage' 'Source health' 'Safety'; do grep -q "$text" /tmp/dashboard.html; done
          for path in '/api/summary' '/api/applications?limit=20' '/api/recruiters?limit=20' '/api/contacts?limit=20' '/api/content?limit=20' '/api/source-health' '/api/platform-coverage'; do grep -q "$path" /tmp/dashboard.html; done
          grep -q 'function renderPlatforms' /tmp/dashboard.html
          grep -q 'platformSearch' /tmp/dashboard.html
      - name: Verify enrichment workers independently execute
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS+360))
          while true; do
            ready=true
            for container in job-agent-local-recruiter job-agent-local-contacts job-agent-local-content; do
              test "$(docker inspect -f '{{.State.Status}}' "$container")" = running
              case "$container" in
                *recruiter*) log=/tmp/job-agent-proactive-recruiter.log ;;
                *contacts*) log=/tmp/job-agent-contact-resources.log ;;
                *content*) log=/tmp/job-agent-content.log ;;
              esac
              count="$(docker exec "$container" sh -lc "test -f '$log' && grep -Ec 'enrichment cycle (completed|failed)' '$log' || true")"
              echo "$container cycles=$count"
              if (( ${count:-0} < 1 )); then ready=false; fi
            done
            if [ "$ready" = true ]; then break; fi
            if (( SECONDS >= deadline )); then echo 'enrichment workers did not complete a real cycle'; exit 1; fi
            sleep 5
          done
      - name: Verify real persisted state, source health and safety
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:3100/api/summary > /tmp/final-summary.json
          curl --fail --silent http://127.0.0.1:3100/api/source-health > /tmp/final-source-health.json
          node - <<'NODE'
          const fs=require('fs'); const s=JSON.parse(fs.readFileSync('/tmp/final-summary.json','utf8'));
          if(Number(s.jobs)<=0 || Number(s.matches)<=0) throw new Error('real jobs/matches were not persisted');
          console.log(JSON.stringify(s));
          NODE
          test "$(docker exec job-agent-local-app printenv AUTOMATION_ENABLED)" = false
          test "$(docker exec job-agent-local-app printenv APPLICATION_DRY_RUN)" = true
          test "$(docker exec job-agent-local-app printenv APPLICATION_LIVE_ENABLED)" = false
          test "$(docker exec job-agent-local-app printenv GMAIL_ENABLED)" = false
          test "$(docker exec job-agent-local-app printenv OUTBOUND_ENABLED)" = false
          live="$(docker exec job-agent-local-postgres psql -U job_agent -d job_agent -tAc 'SELECT COUNT(*) FROM application_attempts WHERE submitted = TRUE;' | tr -d '[:space:]')"
          test "$live" = 0
          sent="$(docker exec job-agent-local-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM recruiter_outreach_messages WHERE UPPER(status)='SENT';" | tr -d '[:space:]')"
          test "$sent" = 0
      - name: Verify recovery after application restart
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker restart job-agent-local-app >/dev/null
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3100/healthz >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:3100/healthz
          for container in job-agent-local-app job-agent-local-postgres job-agent-local-recruiter job-agent-local-contacts job-agent-local-content; do test "$(docker inspect -f '{{.State.Status}}' "$container")" = running; done
      - name: Final acceptance aggregate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/federation-status.txt || { echo 'Federation status artifact missing; federation step did not complete.'; exit 1; }
          test -f /tmp/matching-status.txt || { echo 'Matching status artifact missing; matching step did not complete.'; exit 1; }
          federation_status="$(cut -d= -f2 /tmp/federation-status.txt)"
          matching_status="$(cut -d= -f2 /tmp/matching-status.txt)"
          if (( federation_status != 0 )); then echo "Federation failed: $federation_status"; exit "$federation_status"; fi
          if (( matching_status != 0 )); then echo "Matching failed: $matching_status"; exit "$matching_status"; fi
          test -f /tmp/final-summary.json || { echo 'Final summary missing.'; exit 1; }
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/final-summary.json','utf8'));
          for (const key of ['jobs','matches','recruiters','contacts','content']) {
            if (Number(s[key]) <= 0) throw new Error(`${key} must be > 0 in final persisted runtime: ${s[key]}`);
          }
          if (Number(s.matchApply)+Number(s.matchReview)+Number(s.matchReject)!==Number(s.matches)) throw new Error('final match decisions do not reconcile');
          const p=JSON.parse(fs.readFileSync('/tmp/final-platforms.json','utf8'));
          const actual=p.platforms.filter(x=>x.completed_at!==null && x.completed_at!==undefined);
          if (new Set(actual.map(x=>x.platform_id)).size !== Number(p.registry.total)) throw new Error('final platform coverage is incomplete');
          console.log(JSON.stringify({summary:s,platformRegistry:p.registry,platformOutcomes:actual.length}));
          NODE
      - name: Capture final runtime evidence
        if: always()
        run: |
          mkdir -p /tmp/job-agent-final-runtime
          for file in /tmp/*.json /tmp/dashboard.html /tmp/*status.txt; do test ! -e "$file" || cp -f "$file" /tmp/job-agent-final-runtime/; done
          docker logs job-agent-local-app 2>&1 > /tmp/job-agent-final-runtime/app.log || true
          docker logs job-agent-local-recruiter 2>&1 > /tmp/job-agent-final-runtime/recruiter.log || true
          docker logs job-agent-local-contacts 2>&1 > /tmp/job-agent-final-runtime/contacts.log || true
          docker logs job-agent-local-content 2>&1 > /tmp/job-agent-final-runtime/content.log || true
          docker exec job-agent-local-postgres psql -U job_agent -d job_agent -tAc 'SELECT COUNT(*) FROM job_opportunities; SELECT COUNT(*) FROM match_decisions; SELECT COUNT(*) FROM applications; SELECT COUNT(*) FROM recruiter_contacts; SELECT COUNT(*) FROM public_contact_resources; SELECT COUNT(*) FROM public_contact_resource_contacts;' > /tmp/job-agent-final-runtime/db-counts.txt || true
      - name: Upload final runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-runtime-evidence
          path: /tmp/job-agent-final-runtime
          if-no-files-found: ignore
      - name: Stop local runtime
        if: always()
        run: JOB_AGENT_LOCAL_CLEANUP=true npm run local:stop
