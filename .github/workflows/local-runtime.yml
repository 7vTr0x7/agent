name: Local Runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  local-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      JOB_AGENT_LOCAL_API_PORT: 3100
      JOB_AGENT_LOCAL_RESET: true
      JOB_DISCOVERY_INTERVAL_MS: 120000
      DISCOVERY_SOURCE_TIMEOUT_MS: 20000
      DISCOVERY_SOURCE_RETRIES: 0
      FAST_MATCHING_LIMIT: 150
      CANDIDATE_PROFILE_ID: local-ci-candidate
      CANDIDATE_YEARS_EXPERIENCE: 3
      CANDIDATE_SKILLS: React,Next.js,TypeScript,JavaScript,Redux Toolkit,Node.js,Express,REST APIs,MongoDB,GraphQL,Tailwind,HTML,CSS
      CANDIDATE_TARGET_TITLES: Frontend Engineer,Frontend Developer,React Developer,React/Next.js Developer,Full Stack Developer,Full Stack Engineer
      CANDIDATE_LOCATION: India
      CANDIDATE_PREFERRED_LOCATIONS: Bengaluru,Bangalore,India,Remote
      CANDIDATE_REMOTE_ELIGIBLE: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Job Agent
        run: npm run local:run

      - name: Verify live dashboard and API
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:3100/healthz | tee /tmp/health.json
          curl --fail --silent http://127.0.0.1:3100/api/summary | tee /tmp/summary.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"jobs"' /tmp/summary.json
          grep -q '"topMatches"' /tmp/summary.json

      - name: Allow first discovery and matching cycle to complete
        run: sleep 180

      - name: Capture real local runtime result
        run: |
          set +e
          echo '=== LOCAL STATUS ==='
          npm run local:status | tee /tmp/local-status.txt
          echo "local_status_rc=${PIPESTATUS[0]}"
          echo '=== API SUMMARY ==='
          curl --fail --silent http://127.0.0.1:3100/api/summary | tee /tmp/final-summary.json
          echo "api_summary_rc=${PIPESTATUS[0]}"
          echo '=== APP LOGS ==='
          docker logs job-agent-local-app 2>&1 | tail -n 300 | tee /tmp/local-agent.log
          echo "docker_logs_rc=${PIPESTATUS[0]}"
          echo '=== DATABASE COUNTS ==='
          docker exec job-agent-local-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM job_opportunities;"
          docker exec job-agent-local-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM match_decisions;"
          docker exec job-agent-local-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM applications;"
          echo '=== CONTAINER STATES ==='
          docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' job-agent-local-app job-agent-local-postgres 2>&1
          echo '=== SAFETY LOG ASSERTIONS ==='
          grep -E 'automationEnabled|applicationDryRun|safeDryRunWorkerEnabled|applicationLiveEnabled|gmailEnabled' /tmp/local-agent.log || true

      - name: Verify continuous operation and safety (diagnostic)
        continue-on-error: true
        run: |
          set +e
          sleep 20
          npm run local:status
          echo "status_rc=$?"
          curl --fail --silent http://127.0.0.1:3100/healthz
          echo "health_rc=$?"
          docker inspect -f 'app={{.State.Status}} exit={{.State.ExitCode}}' job-agent-local-app
          docker inspect -f 'postgres={{.State.Status}} exit={{.State.ExitCode}}' job-agent-local-postgres
          docker exec job-agent-local-app printenv AUTOMATION_ENABLED
          docker exec job-agent-local-app printenv APPLICATION_DRY_RUN
          docker exec job-agent-local-app printenv APPLICATION_LIVE_ENABLED
          docker exec job-agent-local-app printenv GMAIL_ENABLED
          docker exec job-agent-local-app printenv OUTBOUND_ENABLED
          docker logs job-agent-local-app 2>&1 | tail -n 500

      - name: Upload local runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-runtime-evidence
          path: /tmp/*.json
          if-no-files-found: ignore

      - name: Assert continuous operation and safety
        run: |
          set -euo pipefail
          test "$(docker inspect -f '{{.State.Status}}' job-agent-local-app)" = running
          test "$(docker inspect -f '{{.State.Status}}' job-agent-local-postgres)" = running
          grep -q 'automationEnabled":false' /tmp/local-agent.log
          grep -q 'applicationDryRun":true' /tmp/local-agent.log
          grep -q 'safeDryRunWorkerEnabled":true' /tmp/local-agent.log
          grep -q 'applicationLiveEnabled":false' /tmp/local-agent.log
          grep -q 'gmailEnabled":false' /tmp/local-agent.log
          test "$(docker exec job-agent-local-app printenv AUTOMATION_ENABLED)" = false
          test "$(docker exec job-agent-local-app printenv APPLICATION_DRY_RUN)" = true
          test "$(docker exec job-agent-local-app printenv APPLICATION_LIVE_ENABLED)" = false
          test "$(docker exec job-agent-local-app printenv GMAIL_ENABLED)" = false
          test "$(docker exec job-agent-local-app printenv OUTBOUND_ENABLED)" = false

      - name: Stop local runtime
        if: always()
        run: JOB_AGENT_LOCAL_CLEANUP=true npm run local:stop
