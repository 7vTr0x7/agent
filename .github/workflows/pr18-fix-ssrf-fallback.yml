name: PR18 SSRF fallback fix
on:
  push:
    branches: [fix/extreme-public-recruiter-discovery]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/extreme-public-recruiter-discovery
      - name: Restore known-good service and preserve SSRF fix
        shell: bash
        run: |
          git show 451ee7673fae1bc6d13b0b8c242e360684728a38:src/recruiters/ProactiveRecruiterDiscoveryService.ts > src/recruiters/ProactiveRecruiterDiscoveryService.ts
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/recruiters/ProactiveRecruiterDiscoveryService.ts
          git commit -m 'fix: restore validated recruiter discovery implementation' || exit 0
          git push origin HEAD:fix/extreme-public-recruiter-discovery
