name: temp-pr18-remediation2
on:
  push:
    branches: [fix/extreme-public-recruiter-discovery]
    paths: [.github/workflows/pr18-remediation2.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/extreme-public-recruiter-discovery}
      - name: Apply corrected in-place patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recruiters/ProactiveRecruiterDiscoveryService.ts')
          s=p.read_text()
          s=s.replace('import { ProactiveRecruiterRoleMatcher, CandidateProfileLike } from "./ProactiveRecruiterRoleMatcher";', 'import { promises as dns } from "node:dns";\nimport { isIP } from "node:net";\nimport { ProactiveRecruiterRoleMatcher, CandidateProfileLike } from "./ProactiveRecruiterRoleMatcher";', 1)
          s=s.replace('interface FetchResult{text:string|null;status?:number;timedOut?:boolean}', 'interface FetchResult{text:string|null;status?:number;timedOut?:boolean;reason?:ProfileFetchFailureReason}', 1)
          marker='type SourceId="google-jina"'
          insert='''type ProfileFetchFailureReason = "SUCCESS"|"INVALID_URL"|"UNSUPPORTED_PROTOCOL"|"SSRF_BLOCKED"|"DNS_FAILURE"|"CONNECTION_FAILURE"|"TLS_FAILURE"|"TIMEOUT"|"REDIRECT_BLOCKED"|"REDIRECT_LIMIT"|"HTTP_403"|"HTTP_404"|"HTTP_429"|"HTTP_5XX"|"HTTP_OTHER"|"CONTENT_TYPE_REJECTED"|"RESPONSE_TOO_LARGE"|"EMPTY_RESPONSE"|"ANTI_BOT"|"INTERSTITIAL"|"PARSE_FAILURE"|"UNKNOWN_FAILURE";\nconst PROFILE_MAX_BYTES=2_000_000, MAX_REDIRECTS=4;\n'''
          s=s.replace(marker,insert+marker,1) if insert not in s else s
          start=s.index('const DEFAULT_FETCH=')
          end=s.index('\nconst stripHtml=',start)
          new='''const DEFAULT_FETCH=async(url:string,signal?:AbortSignal,headers?:Record<string,string>):Promise<FetchResult>=>{\n  let current=url;\n  for(let redirects=0;redirects<=MAX_REDIRECTS;redirects++){\n    const checked=await validatePublicFetchUrl(current);\n    if("reason" in checked)return{text:null,reason:checked.reason};\n    const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),TIMEOUT);const onAbort=():void=>controller.abort();signal?.addEventListener("abort",onAbort,{once:true});\n    try{const response=await fetch(checked.url,{signal:controller.signal,redirect:"manual",headers:{accept:"application/json,text/html,application/xhtml+xml,text/plain;q=0.9,*/*;q=0.5","user-agent":"Mozilla/5.0 (compatible; job-agent-proactive-recruiter/9.0)",...(headers??{})}});\n      if(response.status>=300&&response.status<400){const location=response.headers.get("location");if(!location)return{text:null,status:response.status,reason:"REDIRECT_BLOCKED"};if(redirects>=MAX_REDIRECTS)return{text:null,status:response.status,reason:"REDIRECT_LIMIT"};const next=new URL(location,checked.url).toString();const nextChecked=await validatePublicFetchUrl(next);if("reason" in nextChecked)return{text:null,status:response.status,reason:nextChecked.reason==="SSRF_BLOCKED"?"REDIRECT_BLOCKED":nextChecked.reason};current=nextChecked.url.toString();continue;}\n      if(response.status===403)return{text:null,status:403,reason:"HTTP_403"};if(response.status===404)return{text:null,status:404,reason:"HTTP_404"};if(response.status===429)return{text:null,status:429,reason:"HTTP_429"};if(response.status>=500)return{text:null,status:response.status,reason:"HTTP_5XX"};if(!response.ok)return{text:null,status:response.status,reason:"HTTP_OTHER"};\n      const contentType=(response.headers.get("content-type")??"").split(";",1)[0].trim().toLowerCase();if(contentType&&!(["text/html","application/xhtml+xml","text/plain","application/json","application/ld+json"].includes(contentType)))return{text:null,status:response.status,reason:"CONTENT_TYPE_REJECTED"};\n      const length=response.headers.get("content-length");if(length&&/^\\d+$/.test(length)&&Number(length)>PROFILE_MAX_BYTES)return{text:null,status:response.status,reason:"RESPONSE_TOO_LARGE"};\n      if(response.body){const reader=response.body.getReader();const chunks:Uint8Array[]=[];let total=0;try{while(true){const part=await reader.read();if(part.done)break;const value=part.value;if(!value)continue;total+=value.byteLength;if(total>PROFILE_MAX_BYTES){await reader.cancel();return{text:null,status:response.status,reason:"RESPONSE_TOO_LARGE"};}chunks.push(value);}}finally{reader.releaseLock();}if(total===0)return{text:null,status:response.status,reason:"EMPTY_RESPONSE"};const text=new TextDecoder().decode(concatFetchChunks(chunks,total));if(isProfileInterstitial(text))return{text:null,status:response.status,reason:"INTERSTITIAL"};return{text,status:response.status,reason:"SUCCESS"};}\n      const text=await response.text();if(!text.trim())return{text:null,status:response.status,reason:"EMPTY_RESPONSE"};if(new TextEncoder().encode(text).byteLength>PROFILE_MAX_BYTES)return{text:null,status:response.status,reason:"RESPONSE_TOO_LARGE"};if(isProfileInterstitial(text))return{text:null,status:response.status,reason:"ANTI_BOT"};return{text,status:response.status,reason:"SUCCESS"};\n    }catch(error){const reason=classifyThrownFetchError(error);return{text:null,reason,timedOut:reason==="TIMEOUT"};}finally{clearTimeout(timer);signal?.removeEventListener("abort",onAbort);}\n  }return{text:null,reason:"REDIRECT_LIMIT"};\n};\nasync function validatePublicFetchUrl(value:string):Promise<{url:URL}|{reason:ProfileFetchFailureReason}>{let url:URL;try{url=new URL(value);}catch{return{reason:"INVALID_URL"};}if(url.protocol!=="http:"&&url.protocol!=="https:")return{reason:"UNSUPPORTED_PROTOCOL"};if(url.username||url.password)return{reason:"SSRF_BLOCKED"};const host=url.hostname.toLowerCase().replace(/^\\[|\\]$/g,"");if(!host||host==="localhost"||host.endsWith(".localhost")||host.endsWith(".local"))return{reason:"SSRF_BLOCKED"};if(isIP(host))return isPublicFetchIp(host)?{url}:{reason:"SSRF_BLOCKED"};let addresses:string[];try{addresses=(await dns.lookup(host,{all:true,verbatim:true})).map(a=>a.address);}catch{return{reason:"DNS_FAILURE"};}if(!addresses.length)return{reason:"DNS_FAILURE"};if(addresses.some(a=>!isPublicFetchIp(a)))return{reason:"SSRF_BLOCKED"};return{url};}\nfunction isPublicFetchIp(ip:string):boolean{const value=ip.toLowerCase();if(value.includes("%"))return false;if(isIP(value)===4){const p=value.split(".").map(Number),a=p[0]??-1,b=p[1]??-1,c=p[2]??-1;return !(a===0||a===10||a===127||a>=224||(a===169&&b===254)||(a===172&&b>=16&&b<=31)||(a===192&&b===168)||(a===100&&b>=64&&b<=127)||(a===198&&(b===18||b===19))||(a===192&&b===0&&(c===0||c===2))||(a===198&&b===51&&c===100)||(a===203&&b===0&&c===113));}const h=value.replace(/^\\[|\\]$/g,"");if(h.startsWith("::ffff:")){const mapped=h.slice(7);if(isIP(mapped)===4)return isPublicFetchIp(mapped);}return !(h==="::"||h==="::1"||h.startsWith("fc")||h.startsWith("fd")||h.startsWith("fe8")||h.startsWith("fe9")||h.startsWith("fea")||h.startsWith("feb")||h.startsWith("ff")||h.startsWith("2001:db8:"));}\nfunction concatFetchChunks(chunks:Uint8Array[],total:number){const out=new Uint8Array(total);let offset=0;for(const chunk of chunks){out.set(chunk,offset);offset+=chunk.byteLength;}return out;}\nfunction isProfileInterstitial(text:string){const normalized=text.replace(/<[^>]+>/g," ").replace(/\\s+/g," ").trim();if(normalized.length>12000)return false;const lower=normalized.toLowerCase();const signals=[/verify you are human/,/captcha/,/checking your browser/,/access denied/,/request blocked/,/unusual traffic/,/robot check/,/enable javascript/,/just a moment/,/security verification/].filter(r=>r.test(lower)).length;const profileSignals=[/recruiter|recruiting|talent acquisition|talent partner|sourcer|hiring manager/i,/experience|education|skills|about|contact/i,/linkedin\\.com\\/in\\//i].filter(r=>r.test(lower)).length;return signals>=2||(signals>=1&&profileSignals===0);}\n'''
          s=s[:start]+new+s[end:]
          s=s.replace('function classifyFetchFailure(result:FetchResult){if(result.timedOut)return"timeout";if(result.status===403)return"http_403";if(result.status===429)return"http_429";if((result.status??0)>=500)return"http_5xx";if((result.status??0)>=400)return"http_error";if(result.status===undefined)return"network_or_empty";return"empty_response";}', 'function classifyFetchFailure(result:FetchResult){if(result.reason)return result.reason;if(result.timedOut)return"TIMEOUT";if(result.status===403)return"HTTP_403";if(result.status===429)return"HTTP_429";if((result.status??0)>=500)return"HTTP_5XX";if((result.status??0)>=400)return"HTTP_OTHER";if(result.status===undefined)return"UNKNOWN_FAILURE";return"EMPTY_RESPONSE";}',1)
          s=s.replace('function classifyThrownFetchError(error:unknown){const message=error instanceof Error?error.message.toLowerCase():String(error).toLowerCase();if(/dns|getaddrinfo|enotfound/.test(message))return"dns";if(/tls|certificate|ssl/.test(message))return"tls";if(/timeout|timed out|abort/.test(message))return"timeout";if(/connect|socket|econn/.test(message))return"connection";return"other";}', 'function classifyThrownFetchError(error:unknown):ProfileFetchFailureReason{const message=error instanceof Error?error.message.toLowerCase():String(error).toLowerCase();if(/dns|getaddrinfo|enotfound|eai_again|eai_fail/.test(message))return"DNS_FAILURE";if(/tls|certificate|ssl|cert_/.test(message))return"TLS_FAILURE";if(/timeout|timed out|abort/.test(message))return"TIMEOUT";if(/connect|socket|econn|enetunreach|ehostunreach/.test(message))return"CONNECTION_FAILURE";return"UNKNOWN_FAILURE";}',1)
          s=s.replace('private buildCandidateFromPage(profile:CandidateProfileLike,page:string,source:SourceId,discoveryUrl:string|undefined,m:ProactiveRecruiterDiscoveryMetrics){if(isInfrastructurePage(page,source)){reject(m,"SEARCH_PROVIDER_ERROR_PAGE");return null;}', 'private buildCandidateFromPage(profile:CandidateProfileLike,page:string,source:SourceId,discoveryUrl:string|undefined,m:ProactiveRecruiterDiscoveryMetrics){if(!discoveryUrl){reject(m,"NO_CANDIDATE_URL");return null;}if(isInfrastructurePage(page,source)){reject(m,"SEARCH_PROVIDER_ERROR_PAGE");return null;}',1)
          s=s.replace('const roleMatch=this.matcher.match(profile,page,"");if(!roleMatch.score){reject(m,"ROLE_IRRELEVANT");return null;}if(!RECRUITING.test(page)){reject(m,"NOT_RECRUITER");return null;}', 'const localEvidence=buildEvidence(page,discoveryUrl);if(!localEvidence){reject(m,"INSUFFICIENT_RESULT_EVIDENCE");return null;}const roleMatch=this.matcher.match(profile,localEvidence,"");if(!roleMatch.score){reject(m,"ROLE_IRRELEVANT");return null;}if(!RECRUITING.test(localEvidence)){reject(m,"NOT_RECRUITER");return null;}',1)
          s=s.replace('const name=extractRecruiterName(page);if(!name){reject(m,"IDENTITY_AMBIGUOUS");return null;}const email=extractRecruiterEmail(page,profile),employer=extractEmployer(page,email,discoveryUrl);', 'const name=extractRecruiterName(localEvidence);if(!name){reject(m,"IDENTITY_AMBIGUOUS");return null;}const email=extractRecruiterEmail(localEvidence,profile),employer=extractEmployer(localEvidence,email,discoveryUrl);',1)
          s=s.replace('`[SEARCH_RESULT_EVIDENCE] ${page.slice(0,3000)}`','`[SEARCH_RESULT_EVIDENCE] ${localEvidence.slice(0,3000)}`',1)
          s=s.replace('return words.length>=2&&words.length<=5&&words.every(w=>/^[A-Z][A-Za-z.\'-]+$/.test(w));}', 'return words.length>=2&&words.length<=5&&words.every(w=>/^[A-Z](?:[A-Za-z.\'-]*)$/.test(w))&&words.some(w=>w.length>1);}',1)
          s=s.replace('if(!name&&sourceDomain)name=domainToCompany(sourceDomain);', 'if(!name&&sourceDomain){const root=sourceDomain.split(".")[0]?.replace(/[-_]+/g," ")??"";if(root&&new RegExp(`\\\\b${root.replace(/[.*+?^${}()|[\\]\\\\]/g,"\\\\$&")}\\\\b`,"i").test(e))name=domainToCompany(sourceDomain);}',1)
          p.write_text(s)
          PY
          git diff --check
          npm ci
          npm run typecheck
          npm test -- --runInBand src/recruiters/ProactiveRecruiterDiscoveryService.test.ts src/recruiters/ProactiveRecruiterDiscoveryService.phase10.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/recruiters/ProactiveRecruiterDiscoveryService.ts
          git commit -m "fix: harden recruiter fetch and evidence boundaries"
          git push origin HEAD:fix/extreme-public-recruiter-discovery
