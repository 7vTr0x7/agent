name: CI

on:
  push:
    branches: [main, phase4/controlled-real-world-activation, phase5/real-job-recruiter-intelligence, phase6/controlled-real-gmail-activation, phase7/recruiter-discovery-outreach-preparation, fix/user-visible-runtime-results]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck runtime scripts
        run: npm run typecheck:scripts
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --runInBand
      - name: Build Docker image
        run: docker build --tag job-agent:ci .
      - name: Start isolated PostgreSQL for safe runtime
        run: |
          docker network create job-agent-runtime
          docker run -d --name job-agent-runtime-postgres --network job-agent-runtime -e POSTGRES_DB=job_agent -e POSTGRES_USER=job_agent -e POSTGRES_PASSWORD=ci postgres:17-alpine
          for i in $(seq 1 30); do
            if docker exec job-agent-runtime-postgres pg_isready -U job_agent -d job_agent >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs job-agent-runtime-postgres
          exit 1
      - name: Start Job Agent in SAFE_RUNTIME
        run: |
          docker run -d --name job-agent-runtime-app --network job-agent-runtime -p 127.0.0.1:3000:3000 \
            -e NODE_ENV=test -e LOG_LEVEL=info -e API_HOST=0.0.0.0 -e API_PORT=3000 \
            -e DATABASE_URL=postgres://job_agent:ci@job-agent-runtime-postgres:5432/job_agent \
            -e AUTOMATION_ENABLED=false -e APPLICATION_DRY_RUN=true -e OUTBOUND_ENABLED=false \
            -e STALE_SUBMISSION_RECONCILIATION_ENABLED=false -e JOB_DISCOVERY_ENABLED=false \
            -e RECRUITER_OUTREACH_ENABLED=false -e RECRUITER_OUTREACH_DRY_RUN=true \
            -e RECRUITER_OUTREACH_ACTIVATION=disabled -e RECRUITER_LIVE_ACTIVATION_CONFIRMED=false \
            -e GMAIL_ENABLED=false -e EMAIL_ENABLED=false -e RESUME_TAILORING_ENABLED=false \
            -e CANDIDATE_PROFILE_ID=runtime-test-candidate -e CANDIDATE_YEARS_EXPERIENCE=3 \
            -e 'CANDIDATE_SKILLS=React,Next.js,TypeScript,JavaScript,Redux,Node,Express,MongoDB' \
            -e 'CANDIDATE_TARGET_TITLES=Frontend Engineer,Full Stack Developer,React Developer' \
            -e CANDIDATE_FIRST_NAME=Runtime -e CANDIDATE_LAST_NAME=Test -e CANDIDATE_FULL_NAME='Runtime Test' \
            -e CANDIDATE_LOCATION=India -e CANDIDATE_SPONSORSHIP_REQUIRED=false -e CANDIDATE_NOTICE_PERIOD_DAYS=0 \
            -e GENERIC_APPLICATION_ADAPTER_ENABLED=true -e JOB_DISCOVERY_INTERVAL_MS=60000 \
            -e APPLICATION_QUEUE_INTERVAL_MS=1000 -e STALE_SUBMISSION_CHECK_INTERVAL_MS=1000 \
            -e FOLLOW_UP_INTERVAL_MS=1000 -e INTERVIEW_REMINDER_INTERVAL_MS=1000 \
            -e RECRUITER_FOLLOWUP_ENABLED=true -e RECRUITER_FOLLOWUP_DAY_OFFSETS=4,10,18 job-agent:ci
      - name: Verify safe runtime health and database schema
        shell: bash
        run: |
          for i in $(seq 1 60); do if curl --fail --silent http://127.0.0.1:3000/healthz | tee /tmp/job-agent-health.json; then break; fi; sleep 1; done
          test -s /tmp/job-agent-health.json
          grep -q '\"status\":\"ok\"' /tmp/job-agent-health.json
          docker exec job-agent-runtime-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM schema_migrations;"
          docker exec job-agent-runtime-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM tasks;"
          docker exec job-agent-runtime-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM applications;"
      - name: Verify active Phase 6 database invariants
        shell: bash
        run: |
          set -euo pipefail
          migration_columns="$(docker exec job-agent-runtime-postgres psql -U job_agent -d job_agent -tAc "SELECT string_agg(column_name, ',' ORDER BY ordinal_position) FROM information_schema.columns WHERE table_schema='public' AND table_name='schema_migrations';" | tr -d '[:space:]')"
          migration_primary_key="$(docker exec job-agent-runtime-postgres psql -U job_agent -d job_agent -tAc "SELECT string_agg(a.attname, ',' ORDER BY k.ordinality) FROM pg_constraint c JOIN LATERAL unnest(c.conkey) WITH ORDINALITY AS k(attnum, ordinality) ON TRUE JOIN pg_attribute a ON a.attrelid=c.conrelid AND a.attnum=k.attnum WHERE c.conrelid='public.schema_migrations'::regclass AND c.contype='p';" | tr -d '[:space:]')"
          migration_count="$(docker exec job-agent-runtime-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM schema_migrations WHERE name IN ('030_recruiter_mailbox_verification_invariant.sql','031_recruiter_mailbox_verification_evidence_invariant.sql','032_recruiter_mailbox_evidence_quality_invariant.sql','033_recruiter_mailbox_domain_and_evidence_quality.sql');" | tr -d '[:space:]')"
          constraint_count="$(docker exec job-agent-runtime-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM pg_constraint WHERE conrelid='public.recruiter_contacts'::regclass AND conname IN ('recruiter_contacts_verified_mailbox_evidence_check','recruiter_contacts_verified_email_status_check','recruiter_contacts_mailbox_verification_evidence_check','recruiter_contacts_mailbox_verification_evidence_quality_check','recruiter_contacts_mailbox_verification_evidence_strict_check') AND convalidated=true;" | tr -d '[:space:]')"
          function_count="$(docker exec job-agent-runtime-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM pg_proc WHERE proname='job_agent_has_quality_mailbox_evidence';" | tr -d '[:space:]')"
          index_count="$(docker exec job-agent-runtime-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname='public' AND indexname='uq_proactive_recruiter_sequence';" | tr -d '[:space:]')"
          printf 'Phase 6 invariant values: columns=%s primary_key=%s migrations=%s constraints=%s function=%s index=%s\n' "$migration_columns" "$migration_primary_key" "$migration_count" "$constraint_count" "$function_count" "$index_count"
          test "$migration_columns" = 'id,name,applied_at'
          test "$migration_primary_key" = 'id'
          test "$migration_count" = '4'
          test "$constraint_count" = '5'
          test "$function_count" = '1'
          test "$index_count" = '1'
      - name: Verify read-only Phase 6 eligibility listing
        shell: bash
        run: |
          set -euo pipefail
          docker exec job-agent-runtime-app ./node_modules/.bin/tsx scripts/list-phase6-eligible-outreach.ts | tee /tmp/phase6-eligible.json
          test -s /tmp/phase6-eligible.json
          grep -q '^\[\|^{' /tmp/phase6-eligible.json
      - name: Verify isolated proactive recruiter runtime without a job
        shell: bash
        run: |
          set -euo pipefail
          fixture_name=job-agent-proactive-fixture
          trap 'docker rm -f "$fixture_name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$fixture_name" --network job-agent-runtime -e NODE_ENV=test -e LOG_LEVEL=info \
            -e DATABASE_URL=postgres://job_agent:ci@job-agent-runtime-postgres:5432/job_agent -e AUTOMATION_ENABLED=true \
            -e APPLICATION_DRY_RUN=true -e OUTBOUND_ENABLED=false -e GMAIL_ENABLED=false -e EMAIL_ENABLED=false \
            -e PROACTIVE_RECRUITER_ENABLED=true -e PROACTIVE_RECRUITER_SEND_ENABLED=false -e PROACTIVE_RECRUITER_FIXTURE=true \
            -e RECRUITER_REQUIRE_VERIFIED_EMAIL=true -e CANDIDATE_PROFILE_ID=runtime-test-candidate \
            -e CANDIDATE_YEARS_EXPERIENCE=3 -e 'CANDIDATE_SKILLS=React,Next.js,TypeScript,JavaScript,Redux,Node,Express,MongoDB' \
            -e 'CANDIDATE_TARGET_TITLES=Frontend Engineer,Full Stack Developer,React Developer' -e CANDIDATE_FIRST_NAME=Runtime \
            -e CANDIDATE_LAST_NAME=Test -e CANDIDATE_FULL_NAME='Runtime Test' -e CANDIDATE_LOCATION=India \
            -e CANDIDATE_SPONSORSHIP_REQUIRED=false -e CANDIDATE_NOTICE_PERIOD_DAYS=0 job-agent:ci node scripts/proactive-recruiter-once.cjs
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Running}}' "$fixture_name")" = 'false' ] && break; sleep 1; done
          test "$(docker inspect -f '{{.State.Running}}' "$fixture_name")" = 'false'
          fixture_exit="$(docker inspect -f '{{.State.ExitCode}}' "$fixture_name")"
          docker logs "$fixture_name" > /tmp/proactive-recruiter-fixture.log 2>&1
          cat /tmp/proactive-recruiter-fixture.log
          test "$fixture_exit" = '0'
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/proactive-recruiter-fixture.log
          grep -Eq '"discovered"[[:space:]]*:[[:space:]]*1' /tmp/proactive-recruiter-fixture.log
          grep -Eq '"persisted"[[:space:]]*:[[:space:]]*1' /tmp/proactive-recruiter-fixture.log
          grep -Eq '"prepared"[[:space:]]*:[[:space:]]*1' /tmp/proactive-recruiter-fixture.log
          grep -Eq '"sendEnabled"[[:space:]]*:[[:space:]]*false' /tmp/proactive-recruiter-fixture.log
          recruiter_count="$(docker exec job-agent-runtime-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM recruiter_contacts rc JOIN contacts ct ON ct.id=rc.contact_id WHERE LOWER(ct.email)='jane@acme.com' AND LOWER(rc.company_domain)='acme.com';" | tr -d '[:space:]')"
          test "$recruiter_count" = '1'
          test "$(docker exec job-agent-runtime-postgres psql -U job_agent -d job_agent -tAc "SELECT verified::int FROM recruiter_contacts rc JOIN contacts ct ON ct.id=rc.contact_id WHERE LOWER(ct.email)='jane@acme.com' AND LOWER(company_domain)='acme.com';" | tr -d '[:space:]')" = '0'
          test "$(docker exec job-agent-runtime-postgres psql -U job_agent -d job_agent -tAc "SELECT mailbox_evidence::int FROM recruiter_contacts rc JOIN contacts ct ON ct.id=rc.contact_id WHERE LOWER(ct.email)='jane@acme.com' AND LOWER(rc.company_domain)='acme.com';" | tr -d '[:space:]')" = '0'
          test "$(docker exec job-agent-runtime-postgres psql -U job_agent -d job_agent -tAc "SELECT UPPER(COALESCE(email_status,'')) FROM recruiter_contacts rc JOIN contacts ct ON ct.id=rc.contact_id WHERE LOWER(ct.email)='jane@acme.com' AND LOWER(rc.company_domain)='acme.com';" | tr -d '[:space:]')" != 'VERIFIED'
          verification_status="$(docker exec job-agent-runtime-postgres psql -U job_agent -d job_agent -tAc "SELECT LOWER(COALESCE(verification_status,'')) FROM recruiter_contacts rc JOIN contacts ct ON ct.id=rc.contact_id WHERE LOWER(ct.email)='jane@acme.com' AND LOWER(rc.company_domain)='acme.com';" | tr -d '[:space:]')"; test "$verification_status" != "mailbox_verified"; test "$verification_status" != "verified_mailbox"; test "$verification_status" != "verified"
          test "$(docker exec job-agent-runtime-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM recruiter_proactive_evidence e JOIN recruiter_contacts c ON c.id=e.recruiter_contact_id JOIN contacts ct ON ct.id=c.contact_id WHERE LOWER(ct.email)='jane@acme.com' AND LOWER(c.company_domain)='acme.com';" | tr -d '[:space:]')" -ge 1
          test "$(docker exec job-agent-runtime-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM recruiter_outreach_sequences s JOIN recruiter_contacts c ON c.id=s.recruiter_contact_id JOIN contacts ct ON ct.id=c.contact_id WHERE s.campaign_type='PROACTIVE_RECRUITER' AND s.job_opportunity_id IS NULL AND LOWER(ct.email)='jane@acme.com' AND LOWER(c.company_domain)='acme.com';" | tr -d '[:space:]')" -eq 1
          test "$(docker exec job-agent-runtime-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM recruiter_outreach_messages m JOIN recruiter_outreach_sequences s ON s.id=m.sequence_id JOIN recruiter_contacts c ON c.id=s.recruiter_contact_id JOIN contacts ct ON ct.id=c.contact_id WHERE LOWER(ct.email)='jane@acme.com' AND LOWER(c.company_domain)='acme.com';" | tr -d '[:space:]')" -eq 1
      - name: Verify safe runtime logs and kill switches
        shell: bash
        run: |
          sleep 3
          docker logs job-agent-runtime-app 2>&1 | tee /tmp/job-agent-runtime.log
          ! grep -Eiq 'ERROR|FATAL|UnhandledPromiseRejection|ECONNREFUSED|migration error|authentication error' /tmp/job-agent-runtime.log
          grep -q 'job-agent started' /tmp/job-agent-runtime.log
          ! grep -Eiq 'gmailMessageId|refreshToken|access_token|client_secret|api[_-]?key|password=' /tmp/job-agent-runtime.log
      - name: Verify runtime container stays healthy
        run: test "$(docker inspect -f '{{.State.Running}}' job-agent-runtime-app)" = "true"
      - name: Cleanup safe runtime
        if: always()
        run: |
          docker rm -f job-agent-runtime-app job-agent-runtime-postgres >/dev/null 2>&1 || true
          docker network rm job-agent-runtime >/dev/null 2>&1 || true
