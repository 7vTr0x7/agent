name: Matcher calibration patch
on:
  push:
    branches: [matcher/calibration]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[matcher-calibration-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch canonical matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/matching/DeterministicJobMatcher.ts'); s=p.read_text()
          def replace_fn(src,name,new):
              start=src.index('function '+name)
              nxt=src.find('\nfunction ',start+1)
              return src[:start]+new+(src[nxt:] if nxt!=-1 else '\n')
          s=replace_fn(s,'webEvidence','''function webEvidence(title:string,text:string){if(NATIVE_TITLE.test(title))return false;const native=/\\breact native\\b|\\bexpo\\b|\\bandroid\\b|\\bios\\b|\\bmobile app\\b/i.test(text);if(native&&!/\\breact\\b.*\\bweb\\b|\\bweb\\b.*\\breact\\b|\\bnext(?:\\.js|js)?\\b/i.test(text))return false;return /\\b(react|reactjs|react\\.js|next\\.js|nextjs|next js|frontend|front-end|front end|web ui|user interface)\\b/i.test(title)||(!native&&/\\b(react|reactjs|react\\.js|next\\.js|nextjs|next js|frontend|front-end|front end|web ui|user interface)\\b/i.test(text));}''')
          s=replace_fn(s,'classifyTechnical','''function classifyTechnical(title:string,text:string):TechnicalOrientation{if(NATIVE_TITLE.test(title)||/\\b(?:primary|mainly|mostly|focus(?:ed)? on)\\s+(?:react native|mobile)\\b/i.test(text))return"REACT_NATIVE";const backendTitle=BACKEND_TITLE.test(title)&&!FULL_STACK_TITLE.test(title);const backendStrong=/\\bbackend[- ]focused\\b|\\bbackend[- ]heavy\\b|\\bprimarily backend\\b|\\bbackend architecture\\b|\\bapi platform\\b|\\bmicroservices\\b|\\bdistributed systems\\b|\\bbackend integrations?\\b|\\bapi-based systems\\b|\\bmessage queues?\\b|\\bnode\\.js backend\\b|\\bbackend engineer\\b/i.test(text);if(backendTitle||backendStrong)return"BACKEND_FOCUSED";const web=webEvidence(title,text);if(web&&FULL_STACK_TITLE.test(title))return"FULL_STACK";if(web&&FRONTEND_TITLE.test(title))return"REACT_WEB";if(web)return"FRONTEND";return"UNRELATED";}''')
          s=replace_fn(s,'classifyGeography','''function classifyGeography(job:JobOpportunity):MatchGeography{const loc=normalize(`${job.location??""} ${job.country??""}`),text=normalize(job.description),combined=`${loc} ${normalize(job.title)} ${text}`;const remote=job.workplaceType==="remote"||/\\bremote\\b|\\bwork from home\\b|\\bwfh\\b/i.test(combined);const india=/\\bindia\\b|\\bindian\\b/i.test(loc)||/\\bremote (?:in|from|within) india\\b|\\bindia[- ]eligible\\b|\\bindia based\\b/i.test(text);const blr=/\\bbengaluru\\b|\\bbangalore\\b/i.test(loc);const restricted=/\\b(?:remote|work from home|wfh)\\s*(?:[-,:()]\\s*)?(?:in|from|within)?\\s*(?:the\\s+)?(?:usa|u\\.s\\.a?\\.?|united states(?: of america)?|uk|u\\.k\\.?|united kingdom|canada|australia)\\b|\\b(?:usa|united states|uk|united kingdom|canada|australia)\\s+(?:only|based|based only)\\b|\\b(?:only|must be based in|based in)\\s+(?:the\\s+)?(?:usa|united states|uk|united kingdom|canada|australia)\\b|\\bremote\\s+within\\s+(?:the\\s+)?(?:eu|european union)\\b/i.test(combined);const foreign=/\\b(?:usa|us|united states|uk|united kingdom|canada|australia|germany|berlin|france|paris|poland|ukraine|philippines|brazil|europe|eastern europe)\\b/i.test(loc);if(blr)return"BENGALURU";if(remote&&india&&!restricted)return"REMOTE_INDIA_ELIGIBLE";if(remote&&restricted&&!india)return"REMOTE_RESTRICTED";if(remote)return"REMOTE_WORLDWIDE";if(india)return"INDIA_OTHER";if(job.workplaceType==="onsite"&&foreign)return"FOREIGN_ONSITE";if(job.workplaceType==="hybrid"&&foreign)return"FOREIGN_HYBRID";return"UNKNOWN";}''')
          s=replace_fn(s,'experienceRange','''function experienceRange(text:string){const match=text.match(/\\b(\\d+(?:\\.\\d+)?)\\s*(?:-|–|—|to)\\s*(\\d+(?:\\.\\d+)?)\\s*\\+?\\s*years?\\b/);return match?{min:Number(match[1]),max:Number(match[2])}:null;}''')
          s=replace_fn(s,'requiredExperience','''function requiredExperience(text:string){const a=[...text.matchAll(/(?:minimum|at least|required|must have)\\s+(\\d+(?:\\.\\d+)?)\\s*\\+?\\s*years?(?:\\s+of)?\\s+experience/g)];const b=[...text.matchAll(/\\b(\\d+(?:\\.\\d+)?)\\s*\\+\\s*years?\\s+(?:of\\s+)?(?:strong\\s+)?(?:full[- ]stack\\s+)?experience\\b/g)];const values=[...a,...b].map(m=>Number(m[1])).filter(Number.isFinite);return values.length?Math.max(...values):null;}''')
          marker='if(technicalOrientation==="REACT_NATIVE"||technicalOrientation==="UNRELATED")return reject('
          guard='if(hasMaterialReactFrameworkMismatch(title,text))return reject("A competing frontend framework is explicit/primary without meaningful React or Next.js core requirements.",matchedSkills,missingSkills,evidence,geography,freshness,seniority,technicalOrientation);'
          if 'function hasMaterialReactFrameworkMismatch' not in s:
              s=s.replace(marker,guard+marker)
              helper='''function hasMaterialReactFrameworkMismatch(title:string,text:string){const competing=/\\b(vue(?:\\.js)?|angular(?:\\.js)?|svelte(?:\\.js)?|ember(?:\\.js)?|solid(?:\\.js)?)\\b/i.test(text);if(!competing)return false;const react=(text.match(/\\breact(?:\\.js|js)?\\b/gi)||[]).length;const next=(text.match(/\\bnext(?:\\.js|js)?\\b/gi)||[]).length;if(react+next===0)return true;const strong=/\\b(?:deep knowledge of|deep expertise in|expert(?:ise)? in|primary (?:frontend )?framework(?: is|:)?|must have|must be proficient in|strong experience with|extensive experience with)\\s+(?:vue(?:\\.js)?|angular(?:\\.js)?|svelte(?:\\.js)?|ember(?:\\.js)?|solid(?:\\.js)?)\\b/i.test(text);return strong&&react+next<=2;}'''
              s=s.replace('function requiredExperience',helper+'\nfunction requiredExperience')
          p.write_text(s)
          PY
      - name: Validate matcher and commit
        run: |
          npm run typecheck
          npm test -- --runInBand src/matching/DeterministicJobMatcher.test.ts
          git config user.name 'matcher-calibration-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/matching/DeterministicJobMatcher.ts
          git commit -m '[matcher-calibration-bot] Fix matcher precedence and evidence parsing'
          git push origin HEAD:matcher/calibration
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/matcher-calibration-patch.yml
          git commit -m '[matcher-calibration-bot] Remove temporary matcher patch workflow'
          git push origin HEAD:matcher/calibration
