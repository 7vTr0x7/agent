name: Matcher calibration patch
on:
  push:
    branches: [matcher/calibration]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[matcher-calibration-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate and remove temporary workflow
        run: |
          npm run typecheck
          npm test -- --runInBand src/matching/DeterministicJobMatcher.test.ts
          git config user.name 'matcher-calibration-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/matcher-calibration-patch.yml
          git commit -m '[matcher-calibration-bot] Remove temporary matcher patch workflow'
          git push origin HEAD:matcher/calibration
