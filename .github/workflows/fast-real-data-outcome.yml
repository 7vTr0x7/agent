name: Fast Real Data Outcome Runtime

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: fast-real-data-outcome-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build Docker image
        run: docker build --tag job-agent:fast-outcome .

      - name: Start isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker network create job-agent-fast-outcome
          docker run -d --name job-agent-fast-outcome-postgres --network job-agent-fast-outcome \
            -e POSTGRES_DB=job_agent -e POSTGRES_USER=job_agent \
            -e POSTGRES_PASSWORD=runtime_test_password postgres:17-alpine
          for i in $(seq 1 90); do
            docker exec job-agent-fast-outcome-postgres pg_isready -U job_agent -d job_agent >/dev/null 2>&1 && break
            sleep 1
          done
          for i in $(seq 1 30); do
            docker exec job-agent-fast-outcome-postgres psql -U job_agent -d job_agent -tAc 'SELECT 1;' 2>/dev/null | grep -qx '1' && exit 0
            sleep 1
          done
          echo 'PostgreSQL did not become query-ready' >&2
          exit 1

      - name: Run bounded real-data discovery and matching
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network job-agent-fast-outcome \
            -e NODE_ENV=test -e LOG_LEVEL=warn \
            -e DATABASE_URL=postgres://job_agent:runtime_test_password@job-agent-fast-outcome-postgres:5432/job_agent \
            -e AUTOMATION_ENABLED=false -e APPLICATION_DRY_RUN=true -e APPLICATION_LIVE_ENABLED=false \
            -e OUTBOUND_ENABLED=false -e GMAIL_ENABLED=false -e EMAIL_ENABLED=false \
            -e JOB_DISCOVERY_ENABLED=true -e JOB_DISCOVERY_INTERVAL_MS=3600000 \
            -e CANDIDATE_PROFILE_ID=fast-runtime-candidate -e CANDIDATE_YEARS_EXPERIENCE=3 \
            -e CANDIDATE_SKILLS='React,Next.js,TypeScript,JavaScript,Redux Toolkit,Node.js,Express,REST APIs,MongoDB,GraphQL,Tailwind,HTML,CSS' \
            -e CANDIDATE_TARGET_TITLES='Frontend Engineer,Frontend Developer,React Developer,React/Next.js Developer,Full Stack Developer,Full Stack Engineer' \
            -e CANDIDATE_LOCATION=India -e CANDIDATE_CURRENT_COMPENSATION_LPA=6.5 \
            -e CANDIDATE_NOTICE_PERIOD_DAYS=0 -e CANDIDATE_SPONSORSHIP_REQUIRED=false \
            -e JOB_EXCLUDED_COMPANIES='Octopus Technologies,Sketch Brahma Technologies' \
            -e JOB_SOURCES='[{"id":"remoteok:json","type":"api","name":"remoteok","feedUrl":"https://remoteok.com/api","status":"APPROVED"},{"id":"himalayas:react:india:json","type":"api","name":"himalayas","feedUrl":"https://himalayas.app/jobs/api/search?q=react%20engineer&country=India&sort=recent&page=1","status":"APPROVED"},{"id":"himalayas:nextjs:india:json","type":"api","name":"himalayas","feedUrl":"https://himalayas.app/jobs/api/search?q=next.js&country=India&sort=recent&page=1","status":"APPROVED"},{"id":"himalayas:frontend:india:json","type":"api","name":"himalayas","feedUrl":"https://himalayas.app/jobs/api/search?q=frontend&country=India&sort=recent&page=1","status":"APPROVED"},{"id":"remotefirstjobs:react:rss","type":"rss","name":"remotefirstjobs-react","feedUrl":"https://remotefirstjobs.com/rss/jobs/react.rss","status":"APPROVED"}]' \
            -e DISCOVERY_SOURCE_TIMEOUT_MS=30000 -e DISCOVERY_SOURCE_RETRIES=1 \
            -e FAST_JOB_SOURCE_IDS='remoteok:json,himalayas:react:india:json,himalayas:nextjs:india:json,himalayas:frontend:india:json,remotefirstjobs:react:rss' \
            -e RECRUITER_OUTREACH_ENABLED=false -e RECRUITER_PUBLIC_DOMAIN_SEARCH_ENABLED=true \
            -e RECRUITER_DISPATCH_DIAGNOSTICS=true -e RECRUITER_OUTREACH_DRY_RUN=true \
            -e RECRUITER_OUTREACH_ACTIVATION=disabled -e RECRUITER_REQUIRE_VERIFIED_EMAIL=true \
            -e FAST_MATCHING_LIMIT=150 -e FAST_RECRUITER_TASK_LIMIT=2 -e OLLAMA_TIMEOUT_MS=250 \
            job-agent:fast-outcome npm run outcome:fast-jobs | tee fast-job-outcome.log
          ! grep -Eiq 'refreshToken|access_token|client_secret|api[_-]?key|password=' fast-job-outcome.log
          grep -q '"status": "ok"' fast-job-outcome.log
          grep -q '"countsAgreeWithDatabase": true' fast-job-outcome.log

      - name: Diagnose persisted real jobs
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network job-agent-fast-outcome \
            -e NODE_ENV=test -e DATABASE_URL=postgres://job_agent:runtime_test_password@job-agent-fast-outcome-postgres:5432/job_agent \
            -e CANDIDATE_PROFILE_ID=fast-runtime-candidate -e CANDIDATE_YEARS_EXPERIENCE=3 \
            -e CANDIDATE_LOCATION=India \
            -e CANDIDATE_SKILLS='React,Next.js,TypeScript,JavaScript,Redux Toolkit,Node.js,Express,REST APIs,MongoDB,GraphQL,HTML,CSS,Tailwind' \
            -e CANDIDATE_TARGET_TITLES='Frontend Engineer,Frontend Developer,React Developer,React/Next.js Developer,Full Stack Developer,Full Stack Engineer' \
            job-agent:fast-outcome npm run diagnostics:fast-jobs | tee fast-job-diagnostics.log
          ! grep -Eiq 'refreshToken|access_token|client_secret|api[_-]?key|password=' fast-job-diagnostics.log
          grep -q '"status": "ok"' fast-job-diagnostics.log

      - name: Run real application and email-path evaluation
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network job-agent-fast-outcome \
            -e NODE_ENV=test -e DATABASE_URL=postgres://job_agent:runtime_test_password@job-agent-fast-outcome-postgres:5432/job_agent \
            -e CANDIDATE_PROFILE_ID=fast-runtime-candidate -e CANDIDATE_YEARS_EXPERIENCE=3 -e CANDIDATE_LOCATION=India \
            -e CANDIDATE_SKILLS='React,Next.js,TypeScript,JavaScript,Redux Toolkit,Node.js,Express,REST APIs,MongoDB,GraphQL,HTML,CSS,Tailwind' \
            -e CANDIDATE_TARGET_TITLES='Frontend Engineer,Frontend Developer,React Developer,React/Next.js Developer,Full Stack Developer,Full Stack Engineer' \
            -e JOB_EXCLUDED_COMPANIES='Octopus Technologies,Sketch Brahma Technologies' \
            -e AUTOMATION_ENABLED=false -e APPLICATION_DRY_RUN=true -e APPLICATION_LIVE_ENABLED=false \
            -e GMAIL_ENABLED=false -e OUTBOUND_ENABLED=false -e EMAIL_ENABLED=false -e RECRUITER_OUTREACH_ENABLED=false \
            job-agent:fast-outcome npm run application-email:once | tee fast-application-email-outcome.log
          ! grep -Eiq 'refreshToken|access_token|client_secret|api[_-]?key|password=' fast-application-email-outcome.log
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('fast-application-email-outcome.log', 'utf8');
          const matches = [...text.matchAll(/\n\{\s*"status"\s*:\s*"ok"\s*,/g)];
          if (!matches.length) throw new Error('No valid application runtime JSON found');
          const parsed = JSON.parse(text.slice(matches.at(-1).index + 1).trim());
          if (parsed.status !== 'ok' || parsed.feature !== 'JOB_FIRST_APPLICATION_EMAIL' || parsed.independentEmailBranch !== true || parsed.application?.handlerInvoked !== true) throw new Error('Application runtime did not complete its handler path');
          const email = parsed.emailDiscovery;
          if (email?.started !== true && email?.blocked !== true) throw new Error('Email branch neither started nor reported a safety block');
          if (email?.blocked === true && parsed.target?.companyDomain) throw new Error('Email branch reported blocked despite a validated employer domain');
          console.log(JSON.stringify({application: parsed.application, emailDiscovery: email, target: parsed.target, preparedEmail: parsed.preparedEmail}, null, 2));
          NODE

      - name: Run real content-first discovery
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network job-agent-fast-outcome \
            -e NODE_ENV=test -e DATABASE_URL=postgres://job_agent:runtime_test_password@job-agent-fast-outcome-postgres:5432/job_agent \
            -e CANDIDATE_PROFILE_ID=fast-runtime-candidate -e CANDIDATE_YEARS_EXPERIENCE=3 -e CANDIDATE_LOCATION=India \
            -e CANDIDATE_PREFERRED_LOCATIONS='Bengaluru,Bangalore,India,Remote' \
            -e CANDIDATE_SKILLS='React,Next.js,TypeScript,JavaScript,Redux Toolkit,Node.js,Express,REST APIs,MongoDB,GraphQL,Tailwind,HTML,CSS' \
            -e CANDIDATE_TARGET_TITLES='Frontend Engineer,Frontend Developer,React Developer,React/Next.js Developer,Full Stack Developer,Full Stack Engineer' \
            -e PUBLIC_HIRING_POST_MAX_QUERIES=11 -e PUBLIC_HIRING_POST_DIAGNOSTICS=true \
            job-agent:fast-outcome npm run content-first:once | tee fast-content-outcome.log
          ! grep -Eiq 'refreshToken|access_token|client_secret|api[_-]?key|password=' fast-content-outcome.log
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' fast-content-outcome.log
          grep -Eq '"feature"[[:space:]]*:[[:space:]]*"CONTENT_FIRST"' fast-content-outcome.log

      - name: Run real proactive recruiter discovery
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network job-agent-fast-outcome \
            -e NODE_ENV=test -e DATABASE_URL=postgres://job_agent:runtime_test_password@job-agent-fast-outcome-postgres:5432/job_agent \
            -e CANDIDATE_PROFILE_ID=fast-runtime-candidate -e CANDIDATE_YEARS_EXPERIENCE=3 \
            -e CANDIDATE_SKILLS='React,Next.js,TypeScript,JavaScript,Redux Toolkit,Node.js,Express,REST APIs,MongoDB,GraphQL,HTML,CSS,Tailwind' \
            -e CANDIDATE_TARGET_TITLES='Frontend Engineer,Frontend Developer,React Developer,React/Next.js Developer,Full Stack Developer,Full Stack Engineer' \
            -e CANDIDATE_PREFERRED_LOCATIONS='Bengaluru,Bangalore,India,Remote' -e CANDIDATE_REMOTE_ELIGIBLE=true \
            -e PROACTIVE_RECRUITER_ENABLED=true -e PROACTIVE_RECRUITER_FIXTURE=false -e PROACTIVE_RECRUITER_SEND_ENABLED=false \
            -e PROACTIVE_RECRUITER_MAX_QUERIES=6 -e PROACTIVE_RECRUITER_TARGET_CANDIDATES=3 -e PUBLIC_HIRING_POST_MAX_QUERIES=8 \
            -e RECRUITER_OUTREACH_ENABLED=false -e RECRUITER_OUTREACH_DRY_RUN=true -e RECRUITER_OUTREACH_ACTIVATION=disabled \
            -e RECRUITER_LIVE_ACTIVATION_CONFIRMED=false -e RECRUITER_REQUIRE_VERIFIED_EMAIL=true \
            -e GMAIL_ENABLED=false -e OUTBOUND_ENABLED=false -e AUTOMATION_ENABLED=false -e APPLICATION_DRY_RUN=true \
            job-agent:fast-outcome npm run proactive-recruiter:once | tee fast-recruiter-outcome.log
          ! grep -Eiq 'refreshToken|access_token|client_secret|api[_-]?key|password=' fast-recruiter-outcome.log
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' fast-recruiter-outcome.log
          grep -q '"sendEnabled":false' fast-recruiter-outcome.log

      - name: Run real contact-resource discovery
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network job-agent-fast-outcome \
            -e NODE_ENV=test -e DATABASE_URL=postgres://job_agent:runtime_test_password@job-agent-fast-outcome-postgres:5432/job_agent \
            -e CANDIDATE_PROFILE_ID=fast-runtime-candidate -e CANDIDATE_YEARS_EXPERIENCE=3 -e CANDIDATE_LOCATION=India \
            -e CANDIDATE_PREFERRED_LOCATIONS='Bengaluru,Bangalore,India,Remote' \
            -e CANDIDATE_SKILLS='React,Next.js,TypeScript,JavaScript,Redux Toolkit,Node.js,Express,REST APIs,MongoDB,GraphQL,Tailwind,HTML,CSS' \
            -e CANDIDATE_TARGET_TITLES='Frontend Engineer,Frontend Developer,React Developer,React/Next.js Developer,Full Stack Developer,Full Stack Engineer' \
            -e GMAIL_ENABLED=false -e OUTBOUND_ENABLED=false -e AUTOMATION_ENABLED=false -e APPLICATION_DRY_RUN=true -e APPLICATION_LIVE_ENABLED=false \
            -e RECRUITER_OUTREACH_ENABLED=false job-agent:fast-outcome npm run public-contact-resources:once | tee fast-contact-resource-outcome.log
          ! grep -Eiq 'refreshToken|access_token|client_secret|api[_-]?key|password=' fast-contact-resource-outcome.log
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' fast-contact-resource-outcome.log
          grep -Eq '"feature"[[:space:]]*:[[:space:]]*"PUBLIC_CONTACT_RESOURCE"' fast-contact-resource-outcome.log

      - name: Verify database state and safety
        shell: bash
        run: |
          set -euo pipefail
          sent=$(docker exec job-agent-fast-outcome-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM recruiter_outreach_messages WHERE status='SENT';" | tr -d '[:space:]')
          submitted=$(docker exec job-agent-fast-outcome-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM applications WHERE status IN ('SUBMITTED','IN_PROGRESS');" | tr -d '[:space:]')
          jobs=$(docker exec job-agent-fast-outcome-postgres psql -U job_agent -d job_agent -tAc 'SELECT COUNT(*) FROM job_opportunities;' | tr -d '[:space:]')
          decisions=$(docker exec job-agent-fast-outcome-postgres psql -U job_agent -d job_agent -tAc 'SELECT COUNT(*) FROM match_decisions;' | tr -d '[:space:]')
          test "$sent" = 0; test "$submitted" = 0; test "$jobs" -gt 0; test "$decisions" -gt 0
          echo "FAST_RUNTIME_SAFETY sent=$sent submitted=$submitted jobs=$jobs decisions=$decisions"
          docker exec job-agent-fast-outcome-postgres psql -U job_agent -d job_agent -P pager=off -c "SELECT j.company_name,j.title,j.location,m.decision,m.match_score,j.canonical_url FROM match_decisions m JOIN job_opportunities j ON j.id=m.job_opportunity_id ORDER BY m.match_score DESC LIMIT 15;"
          docker exec job-agent-fast-outcome-postgres psql -U job_agent -d job_agent -P pager=off -c "SELECT c.full_name,c.company_name,c.title,c.email,c.email_status,c.verified,c.confidence,c.relevance_status FROM recruiter_contacts c ORDER BY c.updated_at DESC LIMIT 15;"

      - name: Verify API against the same PostgreSQL state
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name job-agent-fast-outcome-api --network job-agent-fast-outcome \
            -e NODE_ENV=test -e DATABASE_URL=postgres://job_agent:runtime_test_password@job-agent-fast-outcome-postgres:5432/job_agent \
            -e API_HOST=0.0.0.0 -e API_PORT=3000 -e CANDIDATE_PROFILE_ID=fast-runtime-candidate \
            -e AUTOMATION_ENABLED=false -e JOB_DISCOVERY_ENABLED=false -e PROACTIVE_RECRUITER_ENABLED=false \
            job-agent:fast-outcome node dist/api/bootstrap.js
          for i in $(seq 1 30); do
            docker run --rm --network job-agent-fast-outcome job-agent:fast-outcome node -e "fetch('http://job-agent-fast-outcome-api:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && break
            sleep 1
          done
          docker run --rm --network job-agent-fast-outcome job-agent:fast-outcome node <<'NODE'
          (async () => {
            const r = await fetch('http://job-agent-fast-outcome-api:3000/api/summary');
            const body = await r.text();
            if (!r.ok) throw new Error(`summary HTTP ${r.status}: ${body}`);
            const parsed = JSON.parse(body);
            if (Number(parsed.jobs) <= 0 || Number(parsed.matches) <= 0) throw new Error(`empty API summary: ${body}`);
            if (Number(parsed.matchApply) + Number(parsed.matchReview) + Number(parsed.matchReject) !== Number(parsed.matches)) throw new Error(`current match partition mismatch: ${body}`);
            if (Number(parsed.outreachSent) !== 0) throw new Error(`outreach side effect detected: ${body}`);
            console.log(JSON.stringify(parsed, null, 2));
          })().catch(e => { console.error(e.stack || e); process.exit(1); });
          NODE

      - name: Upload real runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-real-data-outcome-logs
          path: |
            fast-job-outcome.log
            fast-job-diagnostics.log
            fast-application-email-outcome.log
            fast-content-outcome.log
            fast-recruiter-outcome.log
            fast-contact-resource-outcome.log

      - name: Cleanup
        if: always()
        run: |
          docker rm -f job-agent-fast-outcome-api >/dev/null 2>&1 || true
          docker rm -f job-agent-fast-outcome-postgres >/dev/null 2>&1 || true
          docker network rm job-agent-fast-outcome >/dev/null 2>&1 || true
