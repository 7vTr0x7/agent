name: Proactive Recruiter Real Validation

on:
  push:
    branches: [matcher/calibration]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: matcher/calibration
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Start isolated PostgreSQL
        run: |
          set -euo pipefail
          docker network create proactive-recruiter-validation
          docker run -d --name proactive-recruiter-postgres --network proactive-recruiter-validation -e POSTGRES_DB=job_agent -e POSTGRES_USER=job_agent -e POSTGRES_PASSWORD=ci postgres:17-alpine
          ready=false
          for i in $(seq 1 60); do
            if docker exec proactive-recruiter-postgres pg_isready -U job_agent -d job_agent >/dev/null 2>&1 && [ "$(docker exec proactive-recruiter-postgres psql -U job_agent -d job_agent -tAc 'SELECT 1' 2>/dev/null | tr -d '[:space:]')" = 1 ]; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
      - name: Migrate isolated database
        run: |
          set -euo pipefail
          docker build --tag job-agent:proactive-validation .
          docker run --rm --network proactive-recruiter-validation -e DATABASE_URL=postgres://job_agent:ci@proactive-recruiter-postgres:5432/job_agent job-agent:proactive-validation node -e "const {Database}=require('./dist/database/Database'); const {MigrationRunner}=require('./dist/database/MigrationRunner'); const db=new Database(process.env.DATABASE_URL); new MigrationRunner(db).run().then(()=>db.close()).catch(e=>{console.error(e);process.exit(1)})"
          test "$(docker exec proactive-recruiter-postgres psql -U job_agent -d job_agent -tAc 'SELECT name FROM schema_migrations ORDER BY id DESC LIMIT 1' | tr -d '[:space:]')" = 038_phase10_activation_safety.sql
      - name: Verify safety state
        run: |
          set -euo pipefail
          test "$(docker exec proactive-recruiter-postgres psql -U job_agent -d job_agent -tAc 'SELECT kill_switch_active FROM runtime_safety_controls WHERE id=TRUE' | tr -d '[:space:]')" = t
      - name: Run existing proactive recruiter route against real public discovery
        run: |
          set -o pipefail
          docker run --rm --network proactive-recruiter-validation \
            -e NODE_ENV=test \
            -e DATABASE_URL=postgres://job_agent:ci@proactive-recruiter-postgres:5432/job_agent \
            -e AUTOMATION_ENABLED=false \
            -e APPLICATION_DRY_RUN=true \
            -e APPLICATION_LIVE_ENABLED=false \
            -e OUTBOUND_ENABLED=false \
            -e GMAIL_ENABLED=false \
            -e PROACTIVE_RECRUITER_ENABLED=true \
            -e PROACTIVE_RECRUITER_SEND_ENABLED=false \
            -e PROACTIVE_RECRUITER_MAX_CANDIDATES_PER_RUN=50 \
            -e RECRUITER_OUTREACH_ENABLED=false \
            -e RECRUITER_OUTREACH_DRY_RUN=true \
            -e RECRUITER_OUTREACH_ACTIVATION=disabled \
            -e RECRUITER_LIVE_ACTIVATION_CONFIRMED=false \
            -e RECRUITER_REQUIRE_VERIFIED_EMAIL=true \
            -e RECRUITER_DISCOVERY_PROVIDER=public-web \
            -e STALE_SUBMISSION_RECONCILIATION_ENABLED=false \
            -e CANDIDATE_PROFILE_ID=proactive-real-validation \
            -e CANDIDATE_YEARS_EXPERIENCE=3 \
            -e 'CANDIDATE_SKILLS=React.js,Next.js,TypeScript,JavaScript,Redux Toolkit,Tailwind,Node.js,Express,REST APIs,MongoDB' \
            -e 'CANDIDATE_TARGET_TITLES=Frontend Engineer,Frontend Developer,React Developer,React.js Developer,React + Next.js Developer,Next.js Developer,Full Stack React Developer,Full Stack Engineer' \
            -e CANDIDATE_FULL_NAME='Salman Shaikh' \
            -e CANDIDATE_LOCATION='Pune, India' \
            -e CANDIDATE_CURRENT_COMPENSATION_LPA=6.5 \
            -e CANDIDATE_EXPECTED_COMPENSATION_LPA=6.5 \
            -e CANDIDATE_PREFERRED_LOCATIONS='Bengaluru,Bangalore,India,Remote' \
            -e CANDIDATE_REMOTE_ELIGIBLE=true \
            -e PROACTIVE_RECRUITER_FIXTURE=false \
            job-agent:proactive-validation ./node_modules/.bin/tsx scripts/proactive-recruiter-once.ts 2>&1 | tee proactive-real.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q '"status":"ok"' proactive-real.log
      - name: Repeat same target for idempotency
        run: |
          set -o pipefail
          docker run --rm --network proactive-recruiter-validation \
            -e NODE_ENV=test -e DATABASE_URL=postgres://job_agent:ci@proactive-recruiter-postgres:5432/job_agent \
            -e AUTOMATION_ENABLED=false -e APPLICATION_DRY_RUN=true -e APPLICATION_LIVE_ENABLED=false -e OUTBOUND_ENABLED=false -e GMAIL_ENABLED=false \
            -e PROACTIVE_RECRUITER_ENABLED=true -e PROACTIVE_RECRUITER_SEND_ENABLED=false -e PROACTIVE_RECRUITER_MAX_CANDIDATES_PER_RUN=50 \
            -e RECRUITER_OUTREACH_ENABLED=false -e RECRUITER_OUTREACH_DRY_RUN=true -e RECRUITER_OUTREACH_ACTIVATION=disabled -e RECRUITER_LIVE_ACTIVATION_CONFIRMED=false -e RECRUITER_REQUIRE_VERIFIED_EMAIL=true -e RECRUITER_DISCOVERY_PROVIDER=public-web -e STALE_SUBMISSION_RECONCILIATION_ENABLED=false \
            -e CANDIDATE_PROFILE_ID=proactive-real-validation -e CANDIDATE_YEARS_EXPERIENCE=3 \
            -e 'CANDIDATE_SKILLS=React.js,Next.js,TypeScript,JavaScript,Redux Toolkit,Tailwind,Node.js,Express,REST APIs,MongoDB' \
            -e 'CANDIDATE_TARGET_TITLES=Frontend Engineer,Frontend Developer,React Developer,React.js Developer,React + Next.js Developer,Next.js Developer,Full Stack React Developer,Full Stack Engineer' \
            -e CANDIDATE_FULL_NAME='Salman Shaikh' -e CANDIDATE_LOCATION='Pune, India' -e CANDIDATE_CURRENT_COMPENSATION_LPA=6.5 -e CANDIDATE_EXPECTED_COMPENSATION_LPA=6.5 \
            -e CANDIDATE_PREFERRED_LOCATIONS='Bengaluru,Bangalore,India,Remote' -e CANDIDATE_REMOTE_ELIGIBLE=true -e PROACTIVE_RECRUITER_FIXTURE=false \
            job-agent:proactive-validation ./node_modules/.bin/tsx scripts/proactive-recruiter-once.ts 2>&1 | tee proactive-real-repeat.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Report actual recruiter data and safety
        run: |
          set -euo pipefail
          docker exec proactive-recruiter-postgres psql -U job_agent -d job_agent -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'recruiter_contacts' AS metric, COUNT(*)::text AS value FROM recruiter_contacts
          UNION ALL SELECT 'proactive_evidence', COUNT(*)::text FROM recruiter_proactive_evidence
          UNION ALL SELECT 'current', COUNT(*)::text FROM recruiter_proactive_evidence WHERE evidence_freshness='current'
          UNION ALL SELECT 'recent', COUNT(*)::text FROM recruiter_proactive_evidence WHERE evidence_freshness='recent'
          UNION ALL SELECT 'historical', COUNT(*)::text FROM recruiter_proactive_evidence WHERE evidence_freshness='historical'
          UNION ALL SELECT 'unknown', COUNT(*)::text FROM recruiter_proactive_evidence WHERE evidence_freshness='unknown'
          UNION ALL SELECT 'email_candidates', COUNT(*)::text FROM recruiter_contacts WHERE email IS NOT NULL
          UNION ALL SELECT 'verified', COUNT(*)::text FROM recruiter_contacts WHERE UPPER(COALESCE(email_status,''))='VERIFIED'
          UNION ALL SELECT 'likely', COUNT(*)::text FROM recruiter_contacts WHERE UPPER(COALESCE(email_status,''))='LIKELY'
          UNION ALL SELECT 'unverified', COUNT(*)::text FROM recruiter_contacts WHERE UPPER(COALESCE(email_status,''))='UNVERIFIED'
          UNION ALL SELECT 'invalid', COUNT(*)::text FROM recruiter_contacts WHERE UPPER(COALESCE(email_status,''))='INVALID'
          UNION ALL SELECT 'campaigns', COUNT(*)::text FROM recruiter_outreach_sequences
          UNION ALL SELECT 'proactive_campaigns', COUNT(*)::text FROM recruiter_outreach_sequences WHERE campaign_type='PROACTIVE_RECRUITER'
          UNION ALL SELECT 'null_job_proactive_campaigns', COUNT(*)::text FROM recruiter_outreach_sequences WHERE campaign_type='PROACTIVE_RECRUITER' AND job_opportunity_id IS NULL
          UNION ALL SELECT 'prepared_messages', COUNT(*)::text FROM recruiter_outreach_messages WHERE status='PREPARED'
          UNION ALL SELECT 'sent_messages', COUNT(*)::text FROM recruiter_outreach_messages WHERE status='SENT';
          SELECT id, company_name, company_domain, full_name, title, email, email_status, verification_status, relevance_status, provider FROM recruiter_contacts ORDER BY confidence DESC NULLS LAST LIMIT 20;
          SQL
          kill="$(docker exec proactive-recruiter-postgres psql -U job_agent -d job_agent -tAc 'SELECT kill_switch_active FROM runtime_safety_controls WHERE id=TRUE' | tr -d '[:space:]')"
          sent="$(docker exec proactive-recruiter-postgres psql -U job_agent -d job_agent -tAc "SELECT COUNT(*) FROM recruiter_outreach_messages WHERE status='SENT'" | tr -d '[:space:]')"
          jobs="$(docker exec proactive-recruiter-postgres psql -U job_agent -d job_agent -tAc 'SELECT COUNT(*) FROM job_opportunities' | tr -d '[:space:]')"
          test "$kill" = t
          test "$sent" = 0
          test "$jobs" = 0
          echo "safety_proof kill_switch_active=$kill sent_messages=$sent jobs=$jobs gmail_sends=0 recruiter_sends=0 applications=0 snov_credits=0"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proactive-recruiter-real-validation
          path: proactive-real*.log
          if-no-files-found: warn
      - name: Cleanup
        if: always()
        run: |
          docker rm -f proactive-recruiter-postgres >/dev/null 2>&1 || true
          docker network rm proactive-recruiter-validation >/dev/null 2>&1 || true
