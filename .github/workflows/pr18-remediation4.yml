name: temp-pr18-remediation4
on:
  push:
    branches: [fix/extreme-public-recruiter-discovery]
    paths: [.github/workflows/pr18-remediation4.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/extreme-public-recruiter-discovery}
      - name: Reuse patch and fix compiler diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          wf=Path('.github/workflows/pr18-remediation.yml').read_text()
          a=wf.index("python3 - <<'PY'")+len("python3 - <<'PY'")
          b=wf.index("\n          PY",a)
          exec(compile(textwrap.dedent(wf[a:b]),'embedded-remediation.py','exec'),{})
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recruiters/ProactiveRecruiterDiscoveryService.ts')
          s=p.read_text()
          s=s.replace('const length=response.headers.get("content-length");','const length=response.headers?.get("content-length");',1)
          s=s.replace('const part=await reader.read();if(part.done)break;total+=part.value.byteLength;','const part=await reader.read();if(part.done)break;const value=part.value;if(!value)continue;total+=value.byteLength;',1)
          s=s.replace('chunks.push(part.value);','chunks.push(value);',1)
          s=s.replace('const p=value.split(".").map(Number),a=p[0],b=p[1],c=p[2];','const p=value.split(".").map(Number),a=p[0]??-1,b=p[1]??-1,c=p[2]??-1;',1)
          p.write_text(s)
          PY
          git diff --check
          npm ci
          npm run typecheck
          npm test -- --runInBand src/recruiters/ProactiveRecruiterDiscoveryService.test.ts src/recruiters/ProactiveRecruiterDiscoveryService.phase10.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/recruiters/ProactiveRecruiterDiscoveryService.ts
          git commit -m "fix: harden recruiter fetch and evidence boundaries"
          git push origin HEAD:fix/extreme-public-recruiter-discovery
