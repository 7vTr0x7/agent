name: Fast Outcome Runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fast-outcome-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build Docker image
        run: docker build --tag job-agent:fast-outcome .
      - name: Start isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker network create job-agent-fast-jobs
          docker run -d --name job-agent-fast-jobs-postgres --network job-agent-fast-jobs -e POSTGRES_DB=job_agent -e POSTGRES_USER=job_agent -e POSTGRES_PASSWORD=fast_runtime_password postgres:17-alpine
          for i in $(seq 1 60); do
            if docker exec job-agent-fast-jobs-postgres pg_isready -U job_agent -d job_agent >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run bounded real-data job outcome
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network job-agent-fast-jobs             -e NODE_ENV=test             -e LOG_LEVEL=info             -e DATABASE_URL=postgres://job_agent:fast_runtime_password@job-agent-fast-jobs-postgres:5432/job_agent             -e CANDIDATE_PROFILE_ID=runtime-fast-candidate             -e CANDIDATE_YEARS_EXPERIENCE=3             -e 'CANDIDATE_SKILLS=React,Next.js,TypeScript,JavaScript,Redux Toolkit,Node.js,Express,REST APIs,MongoDB,GraphQL,HTML,CSS,Tailwind,Bootstrap'             -e 'CANDIDATE_TARGET_TITLES=Frontend Engineer,Frontend Developer,React Developer,UI Developer,Full Stack Developer,Full Stack Engineer'             -e CANDIDATE_PREFERRED_LOCATIONS='Bengaluru,Bangalore,India,Remote'             -e CANDIDATE_LOCATION=India             -e CANDIDATE_REMOTE_ELIGIBLE=true             -e AUTOMATION_ENABLED=false             -e GMAIL_ENABLED=false             -e OUTBOUND_ENABLED=false             -e PROACTIVE_RECRUITER_ENABLED=false             -e PROACTIVE_RECRUITER_SEND_ENABLED=false             -e APPLICATION_DRY_RUN=true             -e STALE_SUBMISSION_RECONCILIATION_ENABLED=false             -e RECRUITER_REQUIRE_VERIFIED_EMAIL=true             -e JOB_DISCOVERY_ENABLED=true             -e FAST_JOB_SOURCES='remoteok:json,himalayas:json,remotefirstjobs:react:rss'             -e FAST_MATCHING_LIMIT=50             -e OLLAMA_TIMEOUT_MS=5000             job-agent:fast-outcome npm run outcome:fast-jobs 2>&1 | tee fast-job-outcome.log
          grep -q '"status": "ok"' fast-job-outcome.log
          ! grep -Eiq 'refreshToken|access_token|client_secret|api[_-]?key' fast-job-outcome.log
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-job-outcome
          path: fast-job-outcome.log
      - name: Cleanup
        if: always()
        run: |
          docker rm -f job-agent-fast-jobs-postgres >/dev/null 2>&1 || true
          docker network rm job-agent-fast-jobs >/dev/null 2>&1 || true

  fast-recruiters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build Docker image
        run: docker build --tag job-agent:fast-outcome .
      - name: Start isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker network create job-agent-fast-recruiters
          docker run -d --name job-agent-fast-recruiters-postgres --network job-agent-fast-recruiters -e POSTGRES_DB=job_agent -e POSTGRES_USER=job_agent -e POSTGRES_PASSWORD=fast_runtime_password postgres:17-alpine
          for i in $(seq 1 60); do
            if docker exec job-agent-fast-recruiters-postgres pg_isready -U job_agent -d job_agent >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run bounded real-data recruiter outcome
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network job-agent-fast-recruiters             -e NODE_ENV=test             -e LOG_LEVEL=info             -e DATABASE_URL=postgres://job_agent:fast_runtime_password@job-agent-fast-recruiters-postgres:5432/job_agent             -e CANDIDATE_PROFILE_ID=runtime-fast-recruiter             -e CANDIDATE_YEARS_EXPERIENCE=3             -e 'CANDIDATE_SKILLS=React,Next.js,TypeScript,JavaScript,Redux Toolkit,Node.js,Express,REST APIs,MongoDB,GraphQL,HTML,CSS,Tailwind,Bootstrap'             -e 'CANDIDATE_TARGET_TITLES=Frontend Engineer,Frontend Developer,React Developer,UI Developer,Full Stack Developer,Full Stack Engineer'             -e CANDIDATE_PREFERRED_LOCATIONS='Bengaluru,Bangalore,India,Remote'             -e CANDIDATE_LOCATION=India             -e CANDIDATE_REMOTE_ELIGIBLE=true             -e PROACTIVE_RECRUITER_ENABLED=true             -e PROACTIVE_RECRUITER_SEND_ENABLED=false             -e RECRUITER_OUTREACH_ENABLED=false             -e RECRUITER_OUTREACH_DRY_RUN=true             -e RECRUITER_OUTREACH_ACTIVATION=disabled             -e RECRUITER_LIVE_ACTIVATION_CONFIRMED=false             -e RECRUITER_REQUIRE_VERIFIED_EMAIL=true             -e GMAIL_ENABLED=false             -e OUTBOUND_ENABLED=false             -e AUTOMATION_ENABLED=false             -e APPLICATION_DRY_RUN=true             -e STALE_SUBMISSION_RECONCILIATION_ENABLED=false             -e PROACTIVE_RECRUITER_MAX_QUERIES=4             -e PROACTIVE_RECRUITER_TARGET_CANDIDATES=3             job-agent:fast-outcome npm run outcome:fast-recruiters 2>&1 | tee fast-recruiter-outcome.log
          grep -q '"status": "ok"' fast-recruiter-outcome.log
          ! grep -Eiq 'refreshToken|access_token|client_secret|api[_-]?key' fast-recruiter-outcome.log
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-recruiter-outcome
          path: fast-recruiter-outcome.log
      - name: Cleanup
        if: always()
        run: |
          docker rm -f job-agent-fast-recruiters-postgres >/dev/null 2>&1 || true
          docker network rm job-agent-fast-recruiters >/dev/null 2>&1 || true
